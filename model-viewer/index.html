<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB 模型檢視器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen tool — top bar (file actions), full stage, bottom panel (stats + view controls) */
:root{
  --bg:#eef0f1; --panel:#ffffff; --ink:#1b2328; --muted:#5f6b72; --line:#d9dee1;
  --accent:#2f6f8f; --accent-ink:#ffffff; --stage:#e4e8ea; --chip:#f4f6f7; --warn:#a4452c;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171a; --panel:#1a2125; --ink:#e4e9ec; --muted:#93a0a7; --line:#2b353b;
  --accent:#7fbcd9; --accent-ink:#0e1418; --stage:#161d21; --chip:#222b30; --warn:#e48a6d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171a; --panel:#1a2125; --ink:#e4e9ec; --muted:#93a0a7; --line:#2b353b;
  --accent:#7fbcd9; --accent-ink:#0e1418; --stage:#161d21; --chip:#222b30; --warn:#e48a6d; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sample select{font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.sample select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar .file{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,label.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.tog:focus-visible,input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
#fileIn{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#stage{position:relative;flex:1;min-height:0;background:var(--stage)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-width:340px;text-align:center;pointer-events:auto;display:flex;flex-direction:column;gap:8px}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.card strong{font-size:15px}
.card .err{color:var(--warn)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#stage.drag::after{content:"放開以開啟模型";position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--stage) 80%,transparent)}
.panel{background:var(--panel);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.stats{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:4px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tog{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 11px;border-radius:999px;font-size:13px}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cut{display:flex;align-items:center;gap:8px;font-size:13px;flex:1;min-width:200px}
.cut input{flex:1;accent-color:var(--accent)}
.cut output{font-family:var(--f-mono);font-size:12px;min-width:56px;text-align:right;color:var(--muted)}
.hint{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;font-size:11px;color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:6px;opacity:.9}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font-size:14px}
  [hidden]{display:none!important}
</style>
</head>
<body>


<div class="bar">
  <h1>GLB 模型檢視器</h1>
  <span class="file" id="fileName">未載入</span>
  <label class="btn primary" for="fileIn">開啟檔案</label>
  <input type="file" id="fileIn" accept=".glb,.gltf,.obj,.stl,.fbx">
  <label class="sample" for="sampleSel"><span>範例</span>
    <select id="sampleSel">
      <option value="reality-home">現實主角家（一樓）</option>
      <option value="hades-bedroom">哈德斯家主角臥室</option>
    </select></label>
</div>

<div id="stage">
  <div class="overlay" id="ov">
    <div class="card" id="ovCard">
      <strong>載入中…</strong>
      <div class="prog"><i id="progBar"></i></div>
    </div>
  </div>
  <div class="hint">拖曳旋轉・右鍵/雙指平移・滾輪縮放・可把檔案拖進來</div>
</div>

<div class="panel">
  <div class="stats" aria-live="polite">
    <span>尺寸<b id="sDim">—</b></span>
    <span>網格<b id="sMesh">—</b></span>
    <span>三角面<b id="sTri">—</b></span>
    <span>材質<b id="sMat">—</b></span>
  </div>
  <div class="ctrls">
    <button class="tog" id="tFit">重新置中</button>
    <button class="tog" id="tTop" aria-pressed="false">俯視</button>
    <button class="tog" id="tRot" aria-pressed="false">自動旋轉</button>
    <button class="tog" id="tWire" aria-pressed="false">線框</button>
    <button class="tog" id="tGrid" aria-pressed="true">格線</button>
    <button class="tog" id="tShadow" aria-pressed="true">陰影</button>
    <label class="cut" for="cutIn">剖切高度
      <input type="range" id="cutIn" min="0" max="1000" value="1000">
      <output id="cutOut">關閉</output>
    </label>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),0.04).texture;
function syncBg(){scene.background=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--stage').trim()||'#e4e8ea');}
syncBg();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncBg);
new MutationObserver(syncBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const camera=new THREE.PerspectiveCamera(45,1,0.01,5000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.autoRotateSpeed=1.2;

scene.add(new THREE.HemisphereLight(0xffffff,0x8d8577,0.4));
const sun=new THREE.DirectionalLight(0xfff2e0,1.4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.02;
scene.add(sun);scene.add(sun.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShadowMaterial({opacity:.18}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
let grid=null,model=null,box=new THREE.Box3(),size=new THREE.Vector3(),center=new THREE.Vector3();
const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),1e6);

/* ---------- overlay ---------- */
const ov=$('ov'),ovCard=$('ovCard');
function showLoading(name){ov.hidden=false;ovCard.innerHTML=`<strong>載入中…</strong><p>${esc(name)}</p><div class="prog"><i id="progBar"></i></div>`;}
function setProg(p){const b=$('progBar');if(b)b.style.width=Math.round(p*100)+'%';}
function showError(msg){ov.hidden=false;ovCard.innerHTML=`<strong class="err">無法開啟這個檔案</strong><p>${esc(msg)}</p><p>支援 .glb、.gltf（單一檔案）、.obj、.stl、.fbx。<br>.blend 請先在 Blender 用「檔案 → 匯出 → glTF 2.0 (.glb)」轉檔。</p>`;}
function showEmpty(){ov.hidden=false;ovCard.innerHTML=`<strong>開啟一個 3D 模型</strong><p>點「開啟檔案」或把檔案拖進來。<br>支援 .glb、.gltf、.obj、.stl、.fbx。</p>`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- loading ---------- */
function clearModel(){if(!model)return;scene.remove(model);model.traverse(o=>{if(o.geometry)o.geometry.dispose();
  if(o.material)[].concat(o.material).forEach(m=>{Object.values(m).forEach(v=>{if(v&&v.isTexture)v.dispose();});m.dispose();});});model=null;}

function loadBuffer(buf,name){
  const ext=name.split('.').pop().toLowerCase();
  return new Promise((res,rej)=>{
    try{
      if(ext==='glb'||ext==='gltf'){new THREE.GLTFLoader().parse(buf,'',g=>res(g.scene),e=>rej(e));}
      else if(ext==='obj'){res(new THREE.OBJLoader().parse(new TextDecoder().decode(buf)));}
      else if(ext==='stl'){const g=new THREE.STLLoader().parse(buf);g.computeVertexNormals();
        res(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xb9c3c9,roughness:.5,metalness:.1})));}
      else if(ext==='fbx'){res(new THREE.FBXLoader().parse(buf,''));}
      else if(ext==='blend'){rej(new Error('瀏覽器無法直接讀取 .blend 原檔。'));}
      else rej(new Error(`不支援的格式：.${ext}`));
    }catch(e){rej(e);}
  });
}

async function openModel(buf,name,opts={}){
  showLoading(name);
  try{
    const obj=await loadBuffer(buf,name);
    clearModel();model=obj;
    if(name.toLowerCase().endsWith('.fbx')||opts.scaleGuess){/* FBX often in cm */}
    model.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;
      [].concat(o.material).forEach(m=>{if(m){m.clippingPlanes=[clip];m.clipShadows=true;m.side=m.side??THREE.FrontSide;}});}});
    scene.add(model);
    box.setFromObject(model);box.getSize(size);box.getCenter(center);
    if(!isFinite(size.x)||size.length()===0)throw new Error('模型沒有可顯示的幾何。');
    // place model on ground
    model.position.y-=box.min.y;box.setFromObject(model);box.getCenter(center);
    layoutHelpers();stats(name);setCut(opts.cut??1);fit(opts.top);
    $('fileName').textContent=name;ov.hidden=true;
  }catch(e){console.error(e);showError(e&&e.message?e.message:String(e));}
}

function layoutHelpers(){
  const m=Math.max(size.x,size.z)*1.6;
  if(grid){scene.remove(grid);grid.geometry.dispose();}
  const step=niceStep(m/20);const div=Math.ceil(m/step);
  grid=new THREE.GridHelper(div*step,div,0x7d8a91,0xb3bcc1);grid.material.transparent=true;grid.material.opacity=.35;
  grid.position.set(center.x,0.001,center.z);grid.visible=$('tGrid').getAttribute('aria-pressed')==='true';scene.add(grid);
  ground.scale.set(m*2,m*2,1);ground.position.set(center.x,0,center.z);
  const r=Math.max(size.x,size.y,size.z);
  sun.position.set(center.x-r*.8,center.y+r*1.6,center.z+r*1.1);sun.target.position.copy(center);
  Object.assign(sun.shadow.camera,{left:-r,right:r,top:r,bottom:-r,near:0.01,far:r*6});sun.shadow.camera.updateProjectionMatrix();
  camera.near=r/1000;camera.far=r*50;camera.updateProjectionMatrix();
  controls.maxDistance=r*10;controls.minDistance=r/200;
}
function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<2?1:n<5?2:5)*p;}
function fmtLen(v){return v>=1?v.toFixed(2)+' m':v>=0.01?(v*100).toFixed(1)+' cm':(v*1000).toFixed(1)+' mm';}

function stats(){
  let meshes=0,tris=0;const mats=new Set();
  model.traverse(o=>{if(o.isMesh){meshes++;const g=o.geometry;tris+=g.index?g.index.count/3:g.attributes.position.count/3;[].concat(o.material).forEach(m=>mats.add(m));}});
  $('sDim').textContent=`${fmtLen(size.x)} × ${fmtLen(size.z)} × ${fmtLen(size.y)}`;
  $('sMesh').textContent=meshes.toLocaleString();$('sTri').textContent=Math.round(tris).toLocaleString();$('sMat').textContent=mats.size;
}

/* ---------- camera ---------- */
let anim=null;
function fit(top){
  const r=size.length()/2;const fov=camera.fov*Math.PI/180;
  const dist=r/Math.sin(fov/2)*(camera.aspect<1?1/camera.aspect*0.9:1)*0.95;
  const tgt=center.clone();tgt.y=box.min.y+size.y*0.3;
  const pos=top?new THREE.Vector3(center.x,center.y+dist,center.z+0.001):tgt.clone().add(new THREE.Vector3(-0.55,0.62,0.7).normalize().multiplyScalar(dist));
  anim={p:pos,t:tgt};
  $('tTop').setAttribute('aria-pressed',!!top);
}
controls.addEventListener('start',()=>{anim=null;});

/* ---------- controls ---------- */
function toggle(id,fn){const b=$(id);b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on);};}
$('tFit').onclick=()=>model&&fit(false);
toggle('tTop',on=>model&&fit(on));
toggle('tRot',on=>controls.autoRotate=on);
toggle('tWire',on=>model&&model.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>m.wireframe=on);}));
toggle('tGrid',on=>grid&&(grid.visible=on));
toggle('tShadow',on=>{sun.castShadow=on;ground.visible=on;});
const cutIn=$('cutIn'),cutOut=$('cutOut');
function setCut(f){cutIn.value=Math.round(f*1000);applyCut();}
function applyCut(){const f=cutIn.value/1000;
  if(!model||f>=0.999){renderer.clippingPlanes=[];clip.constant=1e6;cutOut.textContent='關閉';return;}
  const h=box.min.y+size.y*f;clip.constant=h;cutOut.textContent=fmtLen(h-box.min.y);}
cutIn.oninput=applyCut;
renderer.localClippingEnabled=true;

/* ---------- file input + drag & drop ---------- */
const MAX=200*1024*1024;
function readFile(f){if(f.size>MAX){showError('檔案超過 200 MB，瀏覽器可能無法負荷。');return;}
  showLoading(f.name);const r=new FileReader();r.onprogress=e=>e.lengthComputable&&setProg(e.loaded/e.total);
  r.onload=()=>openModel(r.result,f.name);r.onerror=()=>showError('讀取檔案失敗。');r.readAsArrayBuffer(f);}
$('fileIn').onchange=e=>{const f=e.target.files[0];if(f)readFile(f);e.target.value='';};
['dragenter','dragover'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.add('drag');}));
['dragleave','drop'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.remove('drag');}));
stage.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readFile(f);});

/* ---------- sample ---------- */
const SAMPLES={
  "reality-home":{name:"現實主角家.glb",file:"reality-home.glb?v=1",cut:0.8},
  "hades-bedroom":{name:"哈德斯主角臥室.glb",file:"hades-bedroom.glb?v=2",cut:0.72}
};
async function loadSample(key){
  const smp=SAMPLES[key]||SAMPLES["reality-home"];showLoading(smp.name);
  try{const res=await fetch(smp.file);if(!res.ok)throw new Error('範例檔讀取失敗（'+res.status+'）');
    const total=+res.headers.get('content-length')||0;const reader=res.body.getReader();const chunks=[];let got=0;
    for(;;){const {done,value}=await reader.read();if(done)break;chunks.push(value);got+=value.length;if(total)setProg(got/total);}
    const buf=new Uint8Array(got);let o=0;chunks.forEach(c=>{buf.set(c,o);o+=c.length;});
    openModel(buf.buffer,smp.name,{cut:smp.cut});
  }catch(e){showError(e.message);}
}
const sampleSel=$('sampleSel');
const startKey=(location.hash||'').slice(1);
if(SAMPLES[startKey])sampleSel.value=startKey;
sampleSel.onchange=()=>loadSample(sampleSel.value);

/* ---------- loop ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
camera.position.set(-6,6,8);controls.target.set(0,1,0);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(){requestAnimationFrame(loop);
  if(anim){const k=reduce?1:0.1;camera.position.lerp(anim.p,k);controls.target.lerp(anim.t,k);if(camera.position.distanceTo(anim.p)<size.length()*0.0005)anim=null;}
  controls.update();renderer.render(scene,camera);})();

loadSample(sampleSel.value);
})();
</script>

</body>
</html>
