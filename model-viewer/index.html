<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GLB 模型檢視器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
#houseViews[hidden]{display:none!important}
/* Layout: one-screen tool — top bar (file actions), full stage, bottom panel (stats + view controls) */
:root{
  --bg:#eef0f1; --panel:#ffffff; --ink:#1b2328; --muted:#5f6b72; --line:#d9dee1;
  --accent:#2f6f8f; --accent-ink:#ffffff; --stage:#e4e8ea; --chip:#f4f6f7; --warn:#a4452c;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171a; --panel:#1a2125; --ink:#e4e9ec; --muted:#93a0a7; --line:#2b353b;
  --accent:#7fbcd9; --accent-ink:#0e1418; --stage:#161d21; --chip:#222b30; --warn:#e48a6d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171a; --panel:#1a2125; --ink:#e4e9ec; --muted:#93a0a7; --line:#2b353b;
  --accent:#7fbcd9; --accent-ink:#0e1418; --stage:#161d21; --chip:#222b30; --warn:#e48a6d; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em}
.sample{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sample select{font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.sample select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar .file{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,label.btn{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.tog:focus-visible,input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
#fileIn{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#stage{position:relative;flex:1;min-height:0;background:var(--stage)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-width:340px;text-align:center;pointer-events:auto;display:flex;flex-direction:column;gap:8px}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.card strong{font-size:15px}
.card .err{color:var(--warn)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#stage.drag::after{content:"放開以開啟模型";position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--stage) 80%,transparent)}
.panel{background:var(--panel);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.stats{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.stats b{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:4px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tog{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 11px;border-radius:999px;font-size:13px}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cut{display:flex;align-items:center;gap:8px;font-size:13px;flex:1;min-width:200px}
.cut input{flex:1;accent-color:var(--accent)}
.cut output{font-family:var(--f-mono);font-size:12px;min-width:56px;text-align:right;color:var(--muted)}
.hint{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;font-size:11px;color:var(--muted);background:var(--panel);padding:4px 8px;border-radius:6px;opacity:.9}
.tog:disabled{opacity:.45;cursor:not-allowed}

.avatar-panel{position:absolute;z-index:12;right:12px;top:12px;width:min(330px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px;box-shadow:0 8px 22px #0005}
.avatar-panel header{display:flex;gap:6px;align-items:center;justify-content:space-between}
.avatar-row{border:1px solid var(--line);border-radius:8px;padding:7px;margin-top:8px;background:var(--chip)}
.avatar-row.selected{border-color:var(--accent)}
.avatar-row input{max-width:100%;width:100%;box-sizing:border-box;padding:6px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px}
.avatar-row small{display:block;color:var(--muted);font:11px var(--f-mono);margin:5px 0}
.avatar-actions{display:flex;gap:4px;flex-wrap:wrap}
.avatar-actions button{min-height:34px;padding:5px 8px}
.pov-avatar-select{position:absolute;left:140px;top:12px;max-width:34%;height:36px;background:#20272b;color:white;border:1px solid #777;border-radius:8px}
.pov-camera-mode{position:absolute;right:12px;top:54px}
@media(max-width:560px){.avatar-panel{top:8px;right:8px;max-height:67%}.pov-avatar-select{left:125px;max-width:37%;font-size:12px}}

.pov-ui{overflow:hidden}
.guide{position:absolute;box-shadow:0 0 0 9999px rgba(8,12,16,.5);outline:1px solid rgba(255,255,255,.75);pointer-events:none;
  background-image:linear-gradient(to right,transparent calc(33.333% - .5px),rgba(255,255,255,.28) calc(33.333% - .5px),rgba(255,255,255,.28) calc(33.333% + .5px),transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),rgba(255,255,255,.28) calc(66.666% - .5px),rgba(255,255,255,.28) calc(66.666% + .5px),transparent calc(66.666% + .5px)),
  linear-gradient(to bottom,transparent calc(33.333% - .5px),rgba(255,255,255,.28) calc(33.333% - .5px),rgba(255,255,255,.28) calc(33.333% + .5px),transparent calc(33.333% + .5px),transparent calc(66.666% - .5px),rgba(255,255,255,.28) calc(66.666% - .5px),rgba(255,255,255,.28) calc(66.666% + .5px),transparent calc(66.666% + .5px))}
.guide-label{position:absolute;left:8px;top:6px;font-family:var(--f-mono);font-size:11px;color:#f1f4f5;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.panel.pov .stats,.panel.pov .ctrls{display:none}
.shots{display:flex;flex-direction:column;gap:8px;font-size:13px}
.shots .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.shots .lbl{color:var(--muted);font-size:12px;min-width:2.6em}
.shots input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.shots output,.shots .num{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.shots select,.shots input[type=text]{font:inherit;font-size:13px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
.shots input[type=text]{flex:1;min-width:120px}
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media(max-width:560px){.slots{grid-template-columns:repeat(4,minmax(0,1fr))}}
.slot{position:relative;aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);border-radius:7px;background:var(--chip) center/cover no-repeat;color:var(--ink);font:600 12px var(--f-mono);display:flex;align-items:flex-end;justify-content:flex-start;padding:3px 5px;cursor:pointer;overflow:hidden}
.slot.filled{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);border-color:var(--accent)}
.slot.current{box-shadow:0 0 0 2px var(--accent)}
.slot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shots .msg{font-size:12px;color:var(--muted);min-height:1.2em}
.place-banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}
.pov-ui{position:absolute;inset:0;pointer-events:none}
.pov-ui>*{pointer-events:auto}
.pov-exit{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px}
.pov-speed{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px}
.pov-ui .btn{background:rgba(20,26,30,.72);color:#f1f4f5;border-color:rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.joy{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:22px;width:116px;height:116px;border-radius:50%;background:rgba(20,26,30,.35);border:2px solid rgba(255,255,255,.45);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pov-tip{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;max-width:60%;font-size:11px;color:#f1f4f5;background:rgba(20,26,30,.6);padding:5px 9px;border-radius:6px;pointer-events:none}
.cloud-badge{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:56px;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:min(320px,calc(100% - 24px));font-size:12px;color:#f1f4f5;background:rgba(20,40,70,.78);border:1px solid rgba(120,170,255,.45);padding:6px 8px;border-radius:10px;backdrop-filter:blur(6px)}
.cloud-badge .btn{padding:4px 9px;font-size:12px;background:rgba(255,255,255,.12);color:#f1f4f5;border-color:rgba(255,255,255,.3)}
.cloud-badge .btn[aria-pressed="true"]{background:#4f8ef7;border-color:#4f8ef7}
.cloud-badge a{color:#cfe0ff}
.crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font-size:14px}
  [hidden]{display:none!important}

#modelPreview{position:absolute;inset:0;z-index:30;background:var(--stage);display:flex;flex-direction:column;min-height:0}
.preview-head{padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.preview-head h2{font-size:17px;margin:0}.preview-head p{flex-basis:100%;margin:0;font-size:13px;color:var(--muted)}
.preview-head nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.preview-head button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.preview-head select{max-width:160px;padding:5px}.preview-zoom{display:inline-flex;align-items:center;gap:5px;font-size:13px}.preview-zoom input{width:100px}
#previewViewport{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-x pan-y}
#previewImage{display:block;width:100%;max-width:none;height:auto;margin:auto}
#previewImageStatus{margin:0;padding:6px 14px;font-size:12px;background:var(--panel);color:var(--muted)}
@media(max-width:600px){.preview-head{padding:8px}.preview-head h2{font-size:15px}.preview-head .btn{padding:6px 9px;font-size:12px}.preview-zoom input{width:80px}}
</style>
</head>
<body>


<div class="bar">
  <h1>GLB 模型檢視器</h1>
  <span class="file" id="fileName">未載入</span>
  <label class="btn primary" for="fileIn">開啟檔案</label>
  <input type="file" id="fileIn" accept=".glb,.gltf,.obj,.stl,.fbx">
  <label class="sample" for="sampleSel"><span>範例</span>
    <select id="sampleSel">
      <option value="reality-home">現實主角家（一、二樓）</option>
      <option value="hades-house">哈德斯家 v3.3（EP02 9×8m，一、二樓）</option>
      <option value="reality-highschool">現實高中（校園＋3F 教室）</option>
      <option value="xiji-station">溪磯鎮車站</option>
      <option value="lahudi-academy">拉乎迪學院 R09（景觀＋校門大道＋大階梯）</option>
      
    </select></label>
  <button class="btn" id="openPreview" type="button">配置圖預覽</button>
  
  
  <button class="btn" id="avatarPanelToggle" type="button" aria-controls="avatarPanel" aria-expanded="false">人偶管理 <span id="avatarNum">0</span></button>
  <span id="viewerVersion" class="file" aria-live="polite"></span>
  <span id="academyViews" hidden style="display:inline-flex;gap:6px;flex-wrap:wrap"><button class="btn" id="academyWhole" type="button">整座學院</button><button class="btn" id="academySchool" type="button">L04 主教學樓</button><button class="btn" id="academyLibrary" type="button">L08 圖書館</button><button class="btn" id="academyGate" type="button">校門大道</button><button class="btn" id="academyGarden" type="button">L03 中庭</button><button class="btn" id="academyPlants" type="button">L07 旋梯塔</button></span><label id="academyInteriorPicker" hidden class="sample"><span>室內家具</span><select id="academyInteriorSelect" aria-label="查看學院室內分區"><option value="">選擇區域／樓層</option><option value="L04_1">L04 主教學樓 1F</option><option value="L04_2">L04 主教學樓 2F</option><option value="L06W_1">L06 西翼 1F</option><option value="L06W_2">L06 西翼 2F</option><option value="L06E_1">L06 東翼 1F</option><option value="L06E_2">L06 東翼 2F</option><option value="L05_1">L05 哥德走廊 1F</option><option value="L05_2">L05 哥德走廊 2F</option><option value="L08_1">L08 圖書館 1F</option><option value="L08_2">L08 圖書館 2F</option></select></label>
  <span id="houseViews" hidden style="display:inline-flex;gap:6px;flex-wrap:wrap"><button class="btn" id="house1F">一樓俯視</button><button class="btn" id="house2F">二樓俯視</button><button class="btn" id="houseWhole">完整外觀</button><a class="btn" href="revisions/hades-v3.3/">配置圖</a></span>
</div>

<div id="stage">
  <section id="modelPreview" hidden aria-labelledby="previewTitle">
    <header class="preview-head">
      <h2 id="previewTitle">配置圖預覽</h2>
      <p id="previewMessage" role="status"></p>
      <nav id="previewFloors" aria-label="樓層與外觀"></nav>
      <label>視角 <select id="previewShot" aria-label="預覽視角"></select></label>
      <label class="preview-zoom">放大 <input id="previewZoom" aria-label="預覽放大比例" type="range" min="100" max="300" step="25" value="100"><output id="previewZoomOut">100%</output></label>
      <button class="btn" id="previewReset" type="button">重設大小</button>
      <a class="btn" id="previewReview" href="private-page.html?p=revisions%2Fhades-v3.3%2Findex.html">完整配置圖</a>
      <a class="btn" id="previewDownload" href="#" download>下載 GLB</a>
      <button class="btn" id="previewRetry" type="button">重試 3D</button>
      <button class="btn" id="previewBack" type="button" hidden>返回 3D</button>
    </header>
    <div id="previewViewport" tabindex="0" role="region" aria-label="配置圖，可放大後捲動檢查"><img id="previewImage" alt="住宅配置圖"></div>
    <p id="previewImageStatus" role="status" aria-live="polite"></p>
  </section>

  <div class="overlay" id="ov">
    <div class="card" id="ovCard">
      <strong>載入中…</strong>
      <div class="prog"><i id="progBar"></i></div>
    </div>
  </div>
  <div class="hint" id="hint">拖曳旋轉・右鍵/雙指平移・滾輪縮放・可把檔案拖進來</div>
  <div class="cloud-badge" id="cloudBadge" hidden aria-live="polite"><span id="cloudText">雲端人偶：連線中…</span><button class="btn" id="cloudFollow" type="button" aria-pressed="false">跟隨視角</button></div>
  <div class="place-banner" id="placeBanner" hidden>點模型上的地板放置人偶</div>
  <section class="avatar-panel" id="avatarPanel" hidden aria-label="人偶管理">
    <header><strong>人偶管理</strong><button class="btn primary" id="avatarAdd" type="button">＋新增</button><button class="btn" id="avatarClose" type="button">關閉</button></header>
    <div id="avatarList"></div>
    <p class="avatar-empty" style="font-size:12px;color:var(--muted)">新增後點擊模型地板放置。位置與視角保存在本機瀏覽器。</p>
  </section>
  <div class="pov-ui" id="povUi" hidden>
    <div class="guide" id="guide"><span class="guide-label" id="guideLabel"></span></div>
    <div class="crosshair"></div>
    <button class="btn pov-exit" id="povExit">← 離開人偶視角</button>
    <select id="avatarQuick" class="pov-avatar-select" aria-label="切換人偶"></select>
    <button class="btn pov-speed" id="povSpeed">步行</button>
    <button class="btn pov-camera-mode" id="avatarCamera" type="button">第三人稱</button>
    <div class="joy" id="joy" aria-label="移動搖桿"><i id="joyKnob"></i></div>
    <div class="pov-tip">拖曳畫面轉頭・左下搖桿移動<br>電腦：WASD／方向鍵移動，Shift 加速</div>
  </div>
</div>

<div class="panel">
  <div class="stats" aria-live="polite">
    <span>尺寸<b id="sDim">—</b></span>
    <span>網格<b id="sMesh">—</b></span>
    <span>三角面<b id="sTri">—</b></span>
    <span>材質<b id="sMat">—</b></span>
  </div>
  <div class="shots" id="shotPanel" hidden>
    <div class="row"><span class="lbl">眼高</span>
      <button class="tog" id="eyeStand">站姿 1.6</button><button class="tog" id="eyeSit">坐姿 1.15</button>
      <button class="tog" id="eyeDn" aria-label="眼高降低 5 公分">−</button><span class="num" id="eyeVal">1.60 m</span><button class="tog" id="eyeUp" aria-label="眼高增加 5 公分">＋</button></div>
    <div class="row"><label class="lbl" for="focalIn">焦距</label><input type="range" id="focalIn" min="12" max="85" step="1" value="28"><output id="focalOut">28 mm</output>
      <label class="lbl" for="aspectSel">比例</label><select id="aspectSel"><option>16:9</option><option>2.39:1</option><option>4:3</option><option>1:1</option><option>9:16</option></select></div>
    <div class="slots" id="slots"></div>
    <div class="row"><input type="text" id="shotNote" placeholder="鏡頭說明（選填，例：主角坐在書桌前）" maxlength="60">
      <button class="tog" id="overwrite" aria-pressed="false">覆寫模式</button></div>
    <div class="row"><button class="btn primary" id="expZip">匯出參考圖＋鏡位（ZIP）</button><button class="btn" id="expJson">匯出 JSON</button>
      <label class="btn" for="impJson">匯入 JSON</label><input type="file" id="impJson" accept=".json,application/json" hidden><button class="btn" id="clearShots">清空</button></div>
    <div class="msg" id="shotMsg" aria-live="polite">點空白格儲存目前鏡頭；點已存的格子回到該鏡頭。</div>
  </div>
  <div class="ctrls">
    <button class="tog" id="tPlace" aria-pressed="false">放置人偶</button>
    <button class="tog" id="tPov" disabled>人偶視角</button>
    <button class="tog" id="tCloud" aria-pressed="false" title="顯示 ChatGPT 在雲端移動的人偶（藍色）；需先登入立之雲端庫">雲端人偶</button>
     <button class="tog" id="tCloudCapture" aria-pressed="false" title="登入後主動開啟 30 分鐘 AI 巡查截圖分享；需保持本頁開啟，僅雲端人偶跟隨視角及新 revision 會擷取一張">共享 AI 巡查畫面</button>

<script>
(function(){
const $=id=>document.getElementById(id);
const stage=$('stage');
try {
if(!window.THREE||!THREE.OrbitControls||!THREE.GLTFLoader||!THREE.RoomEnvironment){
  window.GLBPreview.open({unavailable:true});return;
}
let renderer;
for(const options of [{antialias:true,preserveDrawingBuffer:false},{antialias:false,preserveDrawingBuffer:false,powerPreference:'low-power',failIfMajorPerformanceCaveat:false}]){
  try{renderer=new THREE.WebGLRenderer(options);break;}catch(error){console.warn('3D renderer startup attempt failed:',error.message);}
}
if(!renderer){window.GLBPreview.open({unavailable:true});return;}
renderer.domElement.addEventListener('webglcontextlost',event=>{event.preventDefault();window.GLBPreview.open({unavailable:true});});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new THREE.RoomEnvironment(),0.04).texture;
function syncBg(){scene.background=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--stage').trim()||'#e4e8ea');}
syncBg();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',syncBg);
new MutationObserver(syncBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const camera=new THREE.PerspectiveCamera(45,1,0.01,5000);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.autoRotateSpeed=1.2;

scene.add(new THREE.HemisphereLight(0xffffff,0x8d8577,0.4));
const sun=new THREE.DirectionalLight(0xfff2e0,1.4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.02;
scene.add(sun);scene.add(sun.target);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.ShadowMaterial({opacity:.18}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
let grid=null,model=null,box=new THREE.Box3(),size=new THREE.Vector3(),center=new THREE.Vector3();
const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),1e6);

/* ---------- overlay ---------- */
const ov=$('ov'),ovCard=$('ovCard');
function showLoading(name){ov.hidden=false;ovCard.innerHTML=`<strong>載入中…</strong><p>${esc(name)}</p><div class="prog"><i id="progBar"></i></div>`;}
function setProg(p){const b=$('progBar');if(b)b.style.width=Math.round(p*100)+'%';}
function showError(msg){ov.hidden=false;ovCard.innerHTML=`<strong class="err">無法開啟這個檔案</strong><p>${esc(msg)}</p><p>支援 .glb、.gltf（單一檔案）、.obj、.stl、.fbx。<br>.blend 請先在 Blender 用「檔案 → 匯出 → glTF 2.0 (.glb)」轉檔。</p>`;}
function showEmpty(){ov.hidden=false;ovCard.innerHTML=`<strong>開啟一個 3D 模型</strong><p>點「開啟檔案」或把檔案拖進來。<br>支援 .glb、.gltf、.obj、.stl、.fbx。</p>`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- loading ---------- */
function clearModel(){if(!model)return;scene.remove(model);model.traverse(o=>{if(o.geometry)o.geometry.dispose();
  if(o.material)[].concat(o.material).forEach(m=>{Object.values(m).forEach(v=>{if(v&&v.isTexture)v.dispose();});m.dispose();});});model=null;}

function loadBuffer(buf,name){
  const ext=name.split('.').pop().toLowerCase();
  return new Promise((res,rej)=>{
    try{
      if(ext==='glb'||ext==='gltf'){new THREE.GLTFLoader().parse(buf,'',g=>res(g.scene),e=>rej(e));}
      else if(ext==='obj'){res(new THREE.OBJLoader().parse(new TextDecoder().decode(buf)));}
      else if(ext==='stl'){const g=new THREE.STLLoader().parse(buf);g.computeVertexNormals();
        res(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xb9c3c9,roughness:.5,metalness:.1})));}
      else if(ext==='fbx'){res(new THREE.FBXLoader().parse(buf,''));}
      else if(ext==='blend'){rej(new Error('瀏覽器無法直接讀取 .blend 原檔。'));}
      else rej(new Error(`不支援的格式：.${ext}`));
    }catch(e){rej(e);}
  });
}

let modelKey="",modelName="",loadSerial=0;
let inspection=true,meshLayers=[],modelLights=[],sourceInfo=null,activeCutHeight=null;
// The version list lives in private storage with the models; a signed-in session is required.
let manifestPromise=window.LizhiModels.json('current-models.json').then(j=>{window.LIZHI_MODEL_MANIFEST_VERSION=j.version||'';return j.models;}).catch(()=>[]);
function disposeObject(obj){obj.traverse(o=>{o.geometry?.dispose();if(o.material)[].concat(o.material).forEach(m=>{Object.values(m).forEach(v=>{if(v&&v.isTexture)v.dispose();});m.dispose();});});}
function applyInspection(){
  modelLights.forEach(x=>{x.object.visible=window.GLBInspection.lightVisible(x.originalVisible,inspection);});
  meshLayers.forEach(x=>{x.object.visible=x.originalVisible&&window.GLBInspection.keepMesh(x.bounds,activeCutHeight);});
}
function diagnostics(){return {format:'lizhi-glb-viewer-inspection/1',at:new Date().toISOString(),viewerVersion:window.GLBInspection.version,model:modelName,modelKey,source:sourceInfo,inspectionLighting:inspection,exposure:renderer.toneMappingExposure,cutHeight:activeCutHeight,embeddedLights:modelLights.length,embeddedIntensityMax:Math.max(0,...modelLights.map(x=>x.intensity)),hiddenMeshes:meshLayers.filter(x=>!x.object.visible).length,meshCount:meshLayers.length,cameraPosition:camera.position.toArray(),cameraTarget:controls.target.toArray(),viewport:[stage.clientWidth,stage.clientHeight],pixelRatio:renderer.getPixelRatio(),threeRevision:THREE.REVISION,androidVerified:false};}
$('tInspect').onclick=()=>{inspection=!inspection;$('tInspect').setAttribute('aria-pressed',String(inspection));applyInspection();};
$('exposureIn').oninput=e=>{renderer.toneMappingExposure=Number(e.target.value)/100;$('exposureOut').textContent=renderer.toneMappingExposure.toFixed(2);};
$('exportDiagnostics').onclick=()=>download(new Blob([JSON.stringify(diagnostics(),null,2)],{type:'application/json'}),'GLB_檢查紀錄.json');

async function openModel(buf,name,opts={}){
  showLoading(name);
  try{
    const obj=await loadBuffer(buf,name);
    if(opts.serial!=null&&opts.serial!==loadSerial){disposeObject(obj);return;}
    let info=opts.sourceInfo||null;
    if(!info){const bytes=new Uint8Array(await crypto.subtle.digest('SHA-256',buf));
      const hash=Array.from(bytes).map(v=>v.toString(16).padStart(2,'0')).join('');
      info={version:'本機檔案',actualSHA:hash,expectedSHA:null,manifestVerified:false};}
    if(opts.serial!=null&&opts.serial!==loadSerial){disposeObject(obj);return;}
    saveAvatars();clearModel();model=obj;removeFigure();sourceInfo=info;
    if(name.toLowerCase().endsWith('.fbx')||opts.scaleGuess){/* FBX often in cm */}
    model.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;
      [].concat(o.material).forEach(m=>{if(m){m.clippingPlanes=[clip];m.clipShadows=true;m.side=m.side??THREE.FrontSide;}});}});
    scene.add(model);
    box.setFromObject(model);box.getSize(size);box.getCenter(center);
    if(!isFinite(size.x)||size.length()===0)throw new Error('模型沒有可顯示的幾何。');
    // place model on ground
    model.position.y-=box.min.y;model.updateMatrixWorld(true);box.setFromObject(model);box.getCenter(center);
    meshLayers=[];modelLights=[];
    model.traverse(o=>{if(o.isLight){modelLights.push({object:o,originalVisible:o.visible,intensity:o.intensity});}if(o.isMesh){const b=new THREE.Box3().setFromObject(o);meshLayers.push({object:o,originalVisible:o.visible,bounds:{min:b.min.toArray(),max:b.max.toArray()}});}});
    applyInspection();
    layoutHelpers();stats(name);setCut(opts.cut??1);
    fitBox=opts.fit?new THREE.Box3(new THREE.Vector3(opts.fit[0],opts.fit[1]+model.position.y,opts.fit[2]),new THREE.Vector3(opts.fit[3],opts.fit[4]+model.position.y,opts.fit[5])):null;
    fit(opts.top);
    if(opts.key==='lahudi-academy'&&anim){camera.position.copy(anim.p);controls.target.copy(anim.t);controls.update();anim=null;}
    if(opts.key==='lahudi-academy'){renderer.setPixelRatio(Math.min(devicePixelRatio,1.15));renderer.toneMappingExposure=.68;$('exposureIn').value=68;$('exposureOut').textContent='0.68';$('academyWhole').setAttribute('aria-pressed','true');}
    else{renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.toneMappingExposure=.9;$('exposureIn').value=90;$('exposureOut').textContent='0.90';}
    $('viewerVersion').textContent=sourceInfo?.version?sourceInfo.version+' · SHA '+sourceInfo.actualSHA.slice(0,12):'本機檔案 · 版本未登記';
    $('fileName').textContent=name;ov.hidden=true;modelKey=opts.key||('file:'+name);modelName=name;loadShots();loadAvatars();cloudReset();$('houseViews').hidden=modelKey!=='hades-house'||window.GLBPreview.active;if(modelKey==='hades-house')houseView(2);$('academyViews').hidden=modelKey!=='lahudi-academy'||window.GLBPreview.active;$('academyInteriorPicker').hidden=modelKey!=='lahudi-academy'||window.GLBPreview.active;if(modelKey==='lahudi-academy')$('academyInteriorSelect').value='';
  }catch(e){console.error(e);showError(e&&e.message?e.message:String(e));}
}

function layoutHelpers(){
  const m=Math.max(size.x,size.z)*1.6;
  if(grid){scene.remove(grid);grid.geometry.dispose();}
  const step=niceStep(m/20);const div=Math.ceil(m/step);
  grid=new THREE.GridHelper(div*step,div,0x7d8a91,0xb3bcc1);grid.material.transparent=true;grid.material.opacity=.35;
  grid.position.set(center.x,0.001,center.z);grid.visible=$('tGrid').getAttribute('aria-pressed')==='true';scene.add(grid);
  ground.scale.set(m*2,m*2,1);ground.position.set(center.x,0,center.z);
  const r=Math.max(size.x,size.y,size.z);
  sun.position.set(center.x-r*.8,center.y+r*1.6,center.z+r*1.1);sun.target.position.copy(center);
  Object.assign(sun.shadow.camera,{left:-r,right:r,top:r,bottom:-r,near:0.01,far:r*6});sun.shadow.camera.updateProjectionMatrix();
  camera.near=r/1000;camera.far=r*50;camera.updateProjectionMatrix();
  controls.maxDistance=r*10;controls.minDistance=r/200;
}
function niceStep(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<2?1:n<5?2:5)*p;}
function fmtLen(v){return v>=1?v.toFixed(2)+' m':v>=0.01?(v*100).toFixed(1)+' cm':(v*1000).toFixed(1)+' mm';}

function stats(){
  let meshes=0,tris=0;const mats=new Set();
  model.traverse(o=>{if(o.isMesh){meshes++;const g=o.geometry;tris+=g.index?g.index.count/3:g.attributes.position.count/3;[].concat(o.material).forEach(m=>mats.add(m));}});
  $('sDim').textContent=`${fmtLen(size.x)} × ${fmtLen(size.z)} × ${fmtLen(size.y)}`;
  $('sMesh').textContent=meshes.toLocaleString();$('sTri').textContent=Math.round(tris).toLocaleString();$('sMat').textContent=mats.size;
}

/* ---------- camera ---------- */
let anim=null;
let fitBox=null;
function fit(top){
  const fb=fitBox||box,fs=fb.getSize(new THREE.Vector3()),fc=fb.getCenter(new THREE.Vector3());
  const r=fs.length()/2;const fov=camera.fov*Math.PI/180;
  const dist=r/Math.sin(fov/2)*(camera.aspect<1?1/camera.aspect*0.9:1)*0.95;
  const tgt=fc.clone();tgt.y=fb.min.y+fs.y*0.3;
  const pos=top?new THREE.Vector3(fc.x,fc.y+dist,fc.z+0.001):tgt.clone().add(new THREE.Vector3(-0.55,0.62,0.7).normalize().multiplyScalar(dist));
  anim={p:pos,t:tgt};
  $('tTop').setAttribute('aria-pressed',!!top);
}
controls.addEventListener('start',()=>{anim=null;});

/* ---------- controls ---------- */
function toggle(id,fn){const b=$(id);b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on);};}
$('tFit').onclick=()=>model&&fit(false);
toggle('tTop',on=>model&&fit(on));
toggle('tRot',on=>controls.autoRotate=on);
toggle('tWire',on=>model&&model.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>m.wireframe=on);}));
toggle('tGrid',on=>grid&&(grid.visible=on));
toggle('tShadow',on=>{sun.castShadow=on;ground.visible=on;});
const cutIn=$('cutIn'),cutOut=$('cutOut');
function setCut(f){cutIn.value=Math.round(f*1000);applyCut();}
function applyCut(){const f=cutIn.value/1000;
  if(!model||f>=0.999){renderer.clippingPlanes=[];clip.constant=1e6;activeCutHeight=null;applyInspection();cutOut.textContent='關閉';return;}
  const h=box.min.y+size.y*f;clip.constant=h;activeCutHeight=h;applyInspection();cutOut.textContent=fmtLen(h-box.min.y);}
cutIn.oninput=applyCut;
renderer.localClippingEnabled=true;


function houseView(level){
  if(!model||modelKey!=='hades-house')return;
  if(pov)exitPov();
  const off=model.position.y;
  // HADES-v3.0: 9x8 m house centred on origin; 1F +0.000, 2F +3.000, slab underside +2.780, 2F ceiling +5.780.
  if(level===0){setCut(1);fitBox=new THREE.Box3(new THREE.Vector3(-8,off,-7),new THREE.Vector3(8,8+off,13));fit(false);return;}
  const floor=level===1?0:3.0,top=level===1?2.60:5.60;
  setCut(Math.max(0,Math.min(1,(top+off-box.min.y)/size.y)));
  fitBox=new THREE.Box3(new THREE.Vector3(-4.7,floor+off,-4.2),new THREE.Vector3(4.7,top+off,4.4));fit(true);
}

function academyView(region){
  if(!model||modelKey!=='lahudi-academy')return;
  if(pov)exitPov();
  const offset=model.position.y;
  const presets={
    // R03 座標：X 東、glTF Z = −北、Y 上（1 單位 = 1 m）
    whole:[-76,-2.2,-146,76,35,0],
    gate:[-14,-2.2,-84,14,24,0],
    school:[-26,-0.5,-114,26,17.5,-80],
    library:[-32,-0.5,-140,32,17.5,-116],
    garden:[-23,-0.5,-79,23,10,-44]
  };
  const q=presets[region]||presets.whole;
  fitBox=new THREE.Box3(
    new THREE.Vector3(q[0],q[1]+offset,q[2]),
    new THREE.Vector3(q[3],q[4]+offset,q[5]));
  setCut(1);
  fit(false);
  if(region==='garden'){
    // L02 → L03 中軸，望向 L04 正門
    camera.position.set(0,9+offset,-36);
    controls.target.set(0,3+offset,-82);
    controls.update();anim=null;
  }else if(region==='gate'){
    // 動畫鏡位：校門口沿大道望向主樓兩段大階梯與鐘塔
    camera.position.set(0,-0.4+offset,-3);
    controls.target.set(0,6+offset,-60);
    controls.update();anim=null;
  }else if(anim){camera.position.copy(anim.p);controls.target.copy(anim.t);controls.update();anim=null;}
  document.querySelectorAll('#academyViews button').forEach(b=>b.setAttribute('aria-pressed',
    String((region==='whole'&&b.id==='academyWhole')||
      (region==='school'&&b.id==='academySchool')||
      (region==='library'&&b.id==='academyLibrary')||
      (region==='gate'&&b.id==='academyGate')||
      (region==='garden'&&b.id==='academyGarden'))));
}
$('academyWhole').onclick=()=>academyView('whole');
$('academySchool').onclick=()=>academyView('school');
$('academyLibrary').onclick=()=>academyView('library');
$('academyGate').onclick=()=>academyView('gate');
$('academyGarden').onclick=()=>academyView('garden');

function academyPlantFocus(){
  if(!model||modelKey!=='lahudi-academy')return;
  if(pov)exitPov();
  const offset=model.position.y;
  // R03：L07 樓梯塔一樓（旋梯 proxy，PENDING_AUTHOR_REPLACEMENT）
  fitBox=new THREE.Box3(new THREE.Vector3(31,offset-0.5,-101),
     new THREE.Vector3(51,offset+5.2,-81));
  const top=5.0+offset;
  setCut(Math.min(.995,Math.max(.001,(top-box.min.y)/size.y)));
  fit(true);
  if(anim){camera.position.copy(anim.p);controls.target.copy(anim.t);controls.update();anim=null;}
  document.querySelectorAll('#academyViews button').forEach(b=>b.setAttribute('aria-pressed','false'));
  $('academyPlants').setAttribute('aria-pressed','true');
}
$('academyPlants').onclick=academyPlantFocus;


// Academy V12: camera/cutaway presets for review of provisional furniture rooms.
// No separate GLB loaded; always inspect the official single school file.
function academyInteriorView(zone){
 if(!model||modelKey!=='lahudi-academy')return;
 if(pov)exitPov();
 const offset=model.position.y;
 const presets={
   L04_1:[-25,-0.5,-113,25,3.9,-81],  L04_2:[-25,5.3,-113,25,9.4,-81],
   L06W_1:[-71,-0.5,-63,-39,3.9,-41], L06W_2:[-71,5.3,-63,-39,9.4,-41],
   L06E_1:[39,-0.5,-63,71,3.9,-41],   L06E_2:[39,5.3,-63,71,9.4,-41],
   L05_1:[-61,-0.5,-101,-31,3.9,-57], L05_2:[-61,5.3,-101,-31,9.4,-57],
   L08_1:[-31,-0.5,-139,31,3.9,-117], L08_2:[-31,5.3,-139,31,9.4,-117]
 };
 if(!presets[zone])return;
 const a=presets[zone];
 fitBox=new THREE.Box3(
  new THREE.Vector3(a[0],a[1]+offset,a[2]),
  new THREE.Vector3(a[3],a[4]+offset,a[5])
 );
 // Cut at chosen world's Y height, separating upstairs from downstairs.
 const cutWorldY=(zone.endsWith('2')?9.5:4.0)+offset;
 setCut(Math.min(.995,Math.max(.001,(cutWorldY-box.min.y)/size.y)));
 fit(true);
 if(anim){camera.position.copy(anim.p);controls.target.copy(anim.t);controls.update();anim=null;}
 document.querySelectorAll('#academyViews button').forEach(b=>b.setAttribute('aria-pressed','false'));
}
$('academyInteriorSelect').onchange=e=>academyInteriorView(e.target.value);

/* ---------- file input + drag & drop ---------- */
const MAX=200*1024*1024;
function readFile(f){if(f.size>MAX){showError('檔案超過 200 MB，瀏覽器可能無法負荷。');return;}
  const serial=++loadSerial;showLoading(f.name);const r=new FileReader();r.onprogress=e=>e.lengthComputable&&setProg(e.loaded/e.total);
  r.onload=()=>openModel(r.result,f.name,{serial});r.onerror=()=>showError('讀取檔案失敗。');r.readAsArrayBuffer(f);}
$('fileIn').onchange=e=>{const f=e.target.files[0];if(f)readFile(f);e.target.value='';};
['dragenter','dragover'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.add('drag');}));
['dragleave','drop'].forEach(t=>stage.addEventListener(t,e=>{e.preventDefault();stage.classList.remove('drag');}));
stage.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)readFile(f);});

const SAMPLES={

async function loadSample(key){
  const serial=++loadSerial;const smp=SAMPLES[key]||SAMPLES["reality-home"];showLoading(smp.name);
  try{
    // Models are private (owner-only storage). Known versions come from the local cache by SHA,
    // so re-opening the same version costs no download; the hash is re-checked below either way.
    const path=window.LizhiModels.clean(smp.file);
    const listed=smp.expectedSHA?null:(await manifestPromise).find(x=>x.model===key+'.glb');
    const pinned=smp.expectedSHA||listed?.current_sha256||null,cacheKey=pinned?'sha:'+pinned:null;
    let buf;
    try{buf=await window.LizhiModels.bytes(path,{cacheKey,onProgress:setProg});}
    catch(error){if(error.code==='LOGIN_REQUIRED')throw Error('請先回到立之雲端庫首頁登入，再開啟模型（模型只限本人帳號讀取）。');throw error;}
    if(serial!==loadSerial)return;
    const actualSHA=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buf))).map(v=>v.toString(16).padStart(2,'0')).join('');
    const entry=smp.expectedSHA
      ? {current_sha256:smp.expectedSHA,version:smp.version||"TEST_PREVIEW"}
      : (await manifestPromise).find(x=>x.model===key+'.glb');
    if(!entry?.current_sha256)throw Error('無法取得模型版本清單，請重新整理後再試。');
    if(!window.GLBInspection.checkHash(entry.current_sha256,actualSHA)){await window.LizhiModels.forget(cacheKey);throw Error('模型與版本清單不一致，已停止載入；請重新整理後再試。');}
    if(serial!==loadSerial)return;
    await openModel(buf.buffer,smp.name,{serial,cut:smp.cut,key:key,fit:smp.fit,sourceInfo:{version:entry?.version||null,expectedSHA:entry?.current_sha256||null,actualSHA,url:smp.file,manifestVerified:!!entry}});
  }catch(e){if(serial===loadSerial)showError(e.message);}
}

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), tmpN=new THREE.Vector3();
function cutHeight(){return clip.constant<1e5?clip.constant:Infinity;}
function pickFloor(clientX,clientY){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.set(((clientX-r.left)/r.width)*2-1,-((clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);ray.far=Infinity;
  const hits=model?ray.intersectObject(model,true):[];const top=cutHeight()+1e-3;
  for(const h of hits){
    if(h.point.y>top)continue;                                      // clipped away: look through it
    if(!h.face)continue;
    tmpN.copy(h.face.normal).transformDirection(h.object.matrixWorld);
    if(tmpN.y>0.55)return h.point.clone();                          // floor-like surface
    // a wall or furniture side: step back toward the viewer and drop to the floor in front of it
    const back=ray.ray.direction.clone().setY(0).normalize().multiplyScalar(-0.35);
    const from=h.point.clone().add(back);from.y=Math.min(top,h.point.y+0.3);
    ray.set(from,new THREE.Vector3(0,-1,0));ray.far=Infinity;
    const g=ray.intersectObject(model,true).find(k=>k.point.y<=top);
    return g?g.point.clone():null;
  }
  // nothing hit: drop onto the ground plane
  const t=-(ray.ray.origin.y-box.min.y)/ray.ray.direction.y;
  return null; // no surface detected; avoid placing a figure in midair
}

 agentLastContact=Date.now();const c=m.command;
 if(!c||typeof c.request_id!=='string')return;
 const fingerprint=JSON.stringify(c);
 if(agentRequests.has(c.request_id)){
  const old=agentRequests.get(c.request_id);
  if(old.fingerprint!==fingerprint)return;
  if(old.result)parent.postMessage({channel:m.channel,type:'result',nonce:agentNonce,request_id:c.request_id,result:old.result},agentOrigin);
  return;
 }
 if(agentBusy)return;agentBusy=true;
 const record={fingerprint,result:null};agentRequests.set(c.request_id,record);
 try{record.result=await agentExecute(c);}catch(e){record.result={ok:false,code:/^[A-Z_]{3,90}$/.test(e.message)?e.message:'VIEWER_EXECUTION_FAILED',scene:agentScene()};}
 finally{agentBusy=false;}
 parent.postMessage({channel:m.channel,type:'result',nonce:agentNonce,request_id:c.request_id,result:record.result},agentOrigin);
});
function agentWatchdogStop(reason){if(!agentActive)return;agentStop();parent.postMessage({channel:'lizhi-viewer-v1',type:'stopped',nonce:agentNonce,reason},agentOrigin);}
setInterval(()=>{if(agentActive&&!agentBusy&&Date.now()-agentLastContact>8000&&Date.now()>agentGraceUntil)agentWatchdogStop('HEARTBEAT_EXPIRED');},1000);
renderer.domElement.addEventListener('webglcontextlost',()=>agentWatchdogStop('WEBGL_CONTEXT_LOST'));
addEventListener('pagehide',agentStop);

/* ---------- cloud avatars (read-only mirror of ChatGPT-controlled state) ---------- */
// Polls lizhi_viewer_cloud_browser_read with the site's own Supabase login. Blue figures are
// the cloud state; the orange local figures and their localStorage are untouched.
const cloudMat=new THREE.MeshStandardMaterial({color:0x3f7fe8,roughness:.45,metalness:.05,emissive:0x081a3a});
const cloudRingMat=new THREE.MeshBasicMaterial({color:0x3f7fe8,transparent:true,opacity:.8,side:THREE.DoubleSide});
const cloudFigs=new Map();let cloudOn=false,cloudFollowOn=false,cloudRev=-1,cloudTimer=null,cloudClient=null,cloudSelected=null,cloudBusy=false,cloudKey=null;
const CLOUD_WALK=1.6; // m/s along the returned path
// Optional authenticated owner-browser capture. OFF by default and never persisted.
let cloudCaptureEnabled=false,cloudCaptureUntil=0,cloudCaptureBusy=false,cloudCaptureLastRevision=-1;
const CLOUD_CAPTURE_WINDOW_MS=30*60*1000;
function cloudCaptureSet(on){
 cloudCaptureEnabled=!!on;cloudCaptureUntil=on?Date.now()+CLOUD_CAPTURE_WINDOW_MS:0;
 if(!on)cloudCaptureLastRevision=-1;
 $('tCloudCapture').setAttribute('aria-pressed',String(cloudCaptureEnabled));
 $('tCloudCapture').textContent=on?'停止分享巡查畫面':'共享 AI 巡查畫面';
}
async function cloudCaptureFrame(sb,key){
 if(!cloudCaptureEnabled||cloudCaptureBusy)return;
 if(Date.now()>cloudCaptureUntil){cloudCaptureSet(false);cloudSay('巡查畫面分享已自動停止（30 分鐘）');return;}
 if(document.hidden||agentActive||window.GLBPreview.active||!cloudOn||!cloudFollowOn||!model||!sourceInfo?.manifestVerified)return;
 if(cloudRev<0||cloudCaptureLastRevision===cloudRev||!cloudSelected||!cloudFigs.has(cloudSelected))return;
 // Capture only after client-side walking animation reaches the committed server position.
 if(cloudFigs.get(cloudSelected).route.length)return;
 cloudCaptureBusy=true;
 try{
  // Wait for the followed cloud-avatar pose and draw the actual WebGL scene.
  await new Promise(resolve=>requestAnimationFrame(resolve));
  if(!cloudCaptureEnabled||document.hidden||key!==cloudKey||!cloudFollowOn||Date.now()>cloudCaptureUntil)return;
  cloudStep(0);
  const sz=renderer.getSize(new THREE.Vector2()),pr=renderer.getPixelRatio(),asp=camera.aspect;
  let jpeg;
  try{
   renderer.setPixelRatio(1);renderer.setSize(640,360,false);
   camera.aspect=640/360;camera.updateProjectionMatrix();
   renderer.render(scene,camera);
   jpeg=renderer.domElement.toDataURL('image/jpeg',.82);
  }finally{
   renderer.setPixelRatio(pr);renderer.setSize(sz.x,sz.y,false);
   camera.aspect=asp;camera.updateProjectionMatrix();
  }
  if(!jpeg.startsWith('data:image/jpeg;base64,')||jpeg.length<1024||jpeg.length>350050)throw Error('INVALID_BROWSER_JPEG');
  const revision=cloudRev,avatarId=cloudSelected,base64=jpeg.split(',')[1];
  const {data,error}=await sb.rpc('lizhi_viewer_cloud_snapshot_submit',{
   p_model_key:modelKey,p_model_sha:sourceInfo.actualSHA,p_revision:revision,
   p_avatar_id:avatarId,p_jpeg_base64:base64
  });
  if(error)throw error;
  if(!data?.ok)throw Error('FRAME_UPLOAD_REJECTED');
  cloudCaptureLastRevision=revision;
 }catch(e){
  console.warn('Browser WebGL capture not committed:',e);
  cloudSay('巡查畫面上傳失敗（僅瀏覽器中顯示，不代表 AI 已取得圖片）');
 }finally{cloudCaptureBusy=false;}
}
function cloudSupabase(){
  if(cloudClient)return cloudClient;
  try{cloudClient=window.LizhiModels.client();}catch(_e){return null;}
  return cloudClient;
}
function cloudSay(html){$('cloudText').innerHTML=html;}
function buildCloudFigure(){
  const g=buildFigure();
  g.traverse(o=>{if(o.material===figMat)o.material=cloudMat;else if(o.material&&o.material.isMeshBasicMaterial)o.material=cloudRingMat;});
  return g;
}
function cloudClear(){
  for(const f of cloudFigs.values()){scene.remove(f.mesh);f.mesh.traverse(o=>o.geometry?.dispose());}
  cloudFigs.clear();cloudSelected=null;
}
function cloudReset(){cloudClear();cloudRev=-1;cloudKey=null;if(cloudOn)cloudPoll();}
function cloudApply(state){
  const seen=new Set();cloudSelected=state?.selected_id||null;
  for(const a of state?.avatars||[]){
    if(!a||typeof a.id!=='string'||!Array.isArray(a.position)||a.position.length!==3||!a.position.every(Number.isFinite))continue;
    seen.add(a.id);let f=cloudFigs.get(a.id);
    const to=new THREE.Vector3(...a.position);
    if(!f){f={mesh:buildCloudFigure(),route:[],pos:to.clone(),yaw:a.yaw||0};f.mesh.position.copy(to);scene.add(f.mesh);cloudFigs.set(a.id,f);}
    else if(f.pos.distanceTo(to)>1e-3||f.route.length){
      // animate along the server path when it ends where the avatar now is, otherwise glide straight
      const path=Array.isArray(a.last_path)?a.last_path.filter(p=>Array.isArray(p)&&p.length===3&&p.every(Number.isFinite)).map(p=>new THREE.Vector3(...p)):[];
      f.route=path.length>1&&path[path.length-1].distanceTo(to)<.05?path.slice(1):[to];
    }
    f.name=String(a.name||'').slice(0,40);f.yaw=Number.isFinite(a.yaw)?a.yaw:0;f.pitch=Number.isFinite(a.pitch)?a.pitch:0;f.mode=a.mode||'first';f.target=to;
  }
  for(const [id,f] of cloudFigs)if(!seen.has(id)){scene.remove(f.mesh);cloudFigs.delete(id);}
}
async function cloudPoll(){
  if(!cloudOn||cloudBusy||document.hidden)return;
  if(!model||!sourceInfo?.manifestVerified||!/^[a-z0-9_-]{2,80}$/.test(modelKey||'')){cloudSay('雲端人偶只支援已登記版本的範例模型');return;}
  const sb=cloudSupabase();if(!sb){cloudSay('無法載入登入元件');return;}
  const key=modelKey+'|'+sourceInfo.actualSHA;if(key!==cloudKey){cloudClear();cloudRev=-1;cloudKey=key;}
  cloudBusy=true;
  try{
    const {data:sess}=await sb.auth.getSession();
    if(!sess?.session){cloudSay('請先在 <a href="../" target="_top">立之雲端庫</a> 登入，再回來開啟');return;}
    const {data,error}=await sb.rpc('lizhi_viewer_cloud_browser_read',{p_model_key:modelKey,p_model_sha:sourceInfo.actualSHA,p_since:cloudRev});
    if(error)throw error;
    if(key!==cloudKey)return; // model switched while waiting
    if(!data?.unchanged){cloudApply(data?.state);cloudRev=data?.revision??0;}
    const n=cloudFigs.size,sel=cloudFigs.get(cloudSelected);
    cloudSay(n?`雲端 ${n} 個人偶 · rev ${cloudRev}${sel?' · 選取：'+esc(sel.name||'未命名'):''}`:`雲端沒有人偶（rev ${cloudRev}）`);
    if(cloudCaptureEnabled)cloudCaptureFrame(sb,key);
  }catch(e){console.warn('cloud avatars',e);cloudSay('雲端讀取失敗，稍後自動重試');}
  finally{cloudBusy=false;}
}
function cloudSet(on){
  cloudOn=on;$('tCloud').setAttribute('aria-pressed',String(on));$('cloudBadge').hidden=!on;
  try{localStorage.setItem('mv-cloud-avatars',on?'1':'0');}catch(e){}
  clearInterval(cloudTimer);cloudTimer=null;
  if(on){cloudSay('雲端人偶：連線中…');cloudPoll();cloudTimer=setInterval(cloudPoll,2000);}
  else{cloudCaptureSet(false);cloudFollowSet(false);cloudClear();cloudRev=-1;cloudKey=null;}
}
function cloudFollowSet(on){
  if(on&&pov)exitPov();
  cloudFollowOn=on;$('cloudFollow').setAttribute('aria-pressed',String(on));controls.enabled=!on;
  if(on){anim=null;setCut(1);}
  else{cloudCaptureSet(false);for(const f of cloudFigs.values())f.mesh.visible=true;}
}
$('tCloud').onclick=()=>cloudSet(!cloudOn);
$('cloudFollow').onclick=()=>cloudFollowSet(!cloudFollowOn);
$('tCloudCapture').onclick=()=>{
 if(cloudCaptureEnabled){cloudCaptureSet(false);cloudSay('已停止共享巡查畫面');return;}
 if(!model||!sourceInfo?.manifestVerified||window.GLBPreview.active){cloudSay('請先登入並載入已登記版本的 GLB');return;}
 if(!cloudOn)cloudSet(true);
 if(!cloudFollowOn)cloudFollowSet(true);
 cloudCaptureSet(true);cloudCaptureLastRevision=-1;
 cloudSay('已授權 30 分鐘瀏覽器畫面分享；保持本頁開啟，僅新場景版本擷取 640×360 JPEG');
 cloudPoll();
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloudOn)cloudPoll();});
function cloudStep(dt){
  for(const f of cloudFigs.values()){
    let budget=CLOUD_WALK*Math.max(1,f.route.length/12)*dt; // long routes play faster
    while(budget>0&&f.route.length){
      const nxt=f.route[0],d=f.pos.distanceTo(nxt);
      if(d<=budget){f.pos.copy(nxt);f.route.shift();budget-=d;}
      else{const dir=nxt.clone().sub(f.pos);if(Math.hypot(dir.x,dir.z)>1e-4)f.walkYaw=Math.atan2(dir.x,dir.z);f.pos.addScaledVector(dir,budget/d);budget=0;}
    }
    f.mesh.position.copy(f.pos);
    f.mesh.rotation.y=f.route.length&&f.walkYaw!==undefined?f.walkYaw:f.yaw;
  }
  if(!cloudFollowOn)return false;
  const f=cloudFigs.get(cloudSelected)||cloudFigs.values().next().value;if(!f)return false;
  const yawNow=f.mesh.rotation.y,p=f.route.length?0:f.pitch;
  const eye=f.pos.clone().add(new THREE.Vector3(0,1.6,0));
  const d=new THREE.Vector3(Math.sin(yawNow)*Math.cos(p),Math.sin(p),Math.cos(yawNow)*Math.cos(p));
  for(const g of cloudFigs.values())g.mesh.visible=true;
  if(f.mode==='third'||f.mode==='free'||f.mode==='top'){camera.position.copy(eye).addScaledVector(d,-3.2).add(new THREE.Vector3(0,.5,0));camera.lookAt(eye);}
  else{f.mesh.visible=false;camera.position.copy(eye);camera.lookAt(eye.clone().add(d));}
  return true;
}
try{if(localStorage.getItem('mv-cloud-avatars')==='1')setTimeout(()=>cloudSet(true),0);}catch(e){}

/* ---------- loop ---------- */
function resize(){agentRenderNeeded=true;const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix();if(pov)layoutGuide();}
new ResizeObserver(resize).observe(stage);resize();
camera.position.set(-6,6,8);controls.target.set(0,1,0);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastT=performance.now();
(function loop(){requestAnimationFrame(loop);
  const now=performance.now(),dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(window.GLBPreview.active)return;
  if(agentActive){
    if(anim){camera.position.copy(anim.p);controls.target.copy(anim.t);anim=null;agentRenderNeeded=true;}
    if(pov){stepPov(dt);if(keys.size||joyV.lengthSq()>.0025||look)agentRenderNeeded=true;}
    else controls.update();
    if(agentRenderNeeded)agentRender();
    return;
  }
  const following=cloudOn&&cloudStep(dt);
  if(pov){stepPov(dt);renderer.render(scene,camera);return;}
  if(following){renderer.render(scene,camera);return;}
  if(anim){const k=reduce?1:0.1;camera.position.lerp(anim.p,k);controls.target.lerp(anim.t,k);if(camera.position.distanceTo(anim.p)<size.length()*0.0005)anim=null;}
  controls.update();renderer.render(scene,camera);})();

loadSample(sampleSel.value);
window.GLBPreview.ready(()=>{if(model){$('ov').hidden=true;$('fileName').textContent=modelName;}else{$('ov').hidden=false;}},()=>{if(pov)exitPov();});
}catch(error){console.error('3D viewer startup failed:',error);window.GLBPreview.open({unavailable:true});}
})();
</script>
