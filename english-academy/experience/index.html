<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="立之英文學習教室：示範練習與雲端單字、錯句紀錄查詢。">
<title>立之英文學習教室｜練習與雲端紀錄</title>
<link rel="stylesheet" href="./styles.css?v=4">
</head>
<body>
<header id="english-topbar"></header>
<div id="english-cloud-slot"></div>
<div id="app" role="main" aria-live="polite"><p class="p6-gate">正在確認立之雲端庫登入狀態…</p></div>
<script>
(function(){
  const root=document.getElementById('app');
  const gate=text=>{root.innerHTML='';const p=document.createElement('p');p.className='p6-gate';p.textContent=text;root.append(p);};
  // This is an interface gate only: GitHub Pages serves public static assets.
  // No personal information, bearer tokens, or private learning data live here.
  try {
    const portal=window.parent!==window && window.parent.LizhiAuth;
    const user=portal && portal.user;
    if(!user||!portal.allowedEmail||
      String(user.email||'').toLowerCase()!==String(portal.allowedEmail).toLowerCase()){
      gate('請先透過立之雲端庫使用核准的 Google 帳號登入，再從「英文學習教室」選單進入。');
      return;
    }
    const s=document.createElement('script');
    s.type='module';s.src='./app.mjs?v=3';
    s.onerror=()=>{gate('英文練習載入失敗，請重新整理或回到雲端庫。');};
    document.body.append(s);
    const cloud=document.createElement('script');
    cloud.type='module';cloud.src='./cloud-records.mjs?v=3';
    cloud.onerror=()=>{root.insertAdjacentText('beforebegin','雲端學習紀錄無法載入，練習功能仍可使用。');};
    document.body.append(cloud);
  }catch{
    gate('請從立之雲端庫登入後使用英文學習教室。');
  }
})();
</script>
</body>
</html>
