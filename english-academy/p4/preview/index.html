<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#f3f6fb">
 <meta name="description" content="英文學習教室 P4 適性推薦與學習報告隔離展示候選">
 <title>立之英文學習教室｜P4 適性教學候選</title>
 <link rel="stylesheet" href="../../preview/styles.css">
 <style>
  .p4-nav {display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
  .p4-nav .button.active{background:var(--accent-soft);border-color:var(--accent)}
  .p4-banner{margin:0 0 22px}
  .p4-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .p4-row{margin:10px 0;padding:12px 14px;background:var(--soft);border-radius:12px}
  .p4-label{font-size:12px;color:var(--muted)}
  .p4-value{font-weight:750;font-size:19px}
  .p4-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px}
  .p4-outline{border:1px solid var(--border);padding:15px;border-radius:13px;margin:10px 0}
  .p4-outline h3{margin:0 0 8px}
  .p4-options{display:flex;flex-wrap:wrap;gap:8px}
  .p4-select{max-width:220px}
  @media(max-width:780px){.p4-grid{grid-template-columns:1fr}.p4-nav{margin-bottom:14px}}
 </style>
</head>
<body>
 <div id="app"></div>
 <script type="module" src="./app.mjs"></script>
</body>
</html>
