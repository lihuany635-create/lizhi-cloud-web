name: CAD Staging S3 HTTP Emulator
on:
  push:
    branches: [feature/cad-m2-spec-v1-20261024]
    paths:
      - 'engineering/cad/cloud-cad-s3-*'
      - 'engineering/cad/cloud-cad-object-revisions*'
      - 'engineering/cad/sql/**'
      - 'engineering/cad/cad-artifact-manifest.cjs'
      - '.github/workflows/cad-minio-s3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  minio-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cad_ci_only
          POSTGRES_DB: cad_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cad_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable S3 HTTP emulator
        run: |
          python3 -m venv "$RUNNER_TEMP/cad-moto"
          "$RUNNER_TEMP/cad-moto/bin/pip" install --quiet "moto[server]==5.1.16"
          "$RUNNER_TEMP/cad-moto/bin/moto_server" -H 127.0.0.1 -p 9000 >s3-test.log 2>&1 &
          echo "$!" >s3-test.pid
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:9000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat s3-test.log
          exit 1
      - name: Install temporary S3 SDK for tests only
        run: npm install --prefix "$RUNNER_TEMP/cad-s3-test" --no-audit --no-fund --ignore-scripts @aws-sdk/client-s3@3.800.0
      - name: Install temporary Postgres client for joined test
        run: npm install --prefix "$RUNNER_TEMP/cad-s3-test" --no-audit --no-fund --ignore-scripts pg@8.16.3
      - name: Run actual S3 immutable version validation
        env:
          CAD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: NODE_PATH="$RUNNER_TEMP/cad-s3-test/node_modules" node engineering/cad/cloud-cad-s3-live.integration.cjs
      - name: Verify atomic PostgreSQL + S3 object revision publication
        env:
          CAD_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          DATABASE_URL: postgres://postgres:cad_ci_only@127.0.0.1:5432/cad_ci
        run: NODE_PATH="$RUNNER_TEMP/cad-s3-test/node_modules" node engineering/cad/cloud-cad-object-revisions.integration.cjs
      - name: Preserve staged DXF and verification report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-cad-object-atomic-evidence
          path: cad-object-evidence/
          if-no-files-found: error
      - name: Stop isolated S3 emulator
        if: always()
        run: |
          if test -f s3-test.pid; then kill "$(cat s3-test.pid)" || true; fi
          if test -f s3-test.log; then tail -n 30 s3-test.log; fi
