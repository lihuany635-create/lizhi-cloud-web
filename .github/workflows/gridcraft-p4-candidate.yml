name: GridCraft P4 guarded write candidate (no production writes)

on:
  push:
    branches:
      - feat/gridcraft-p4-safe-write-20261118
    paths:
      - .github/workflows/gridcraft-p4-candidate.yml
      - integrations/gridcraft/gridcraft_p4_*.py
      - integrations/gridcraft/gridcraft_desktop_local.py
      - integrations/gridcraft/test_p4_*.py
      - integrations/gridcraft/gridcraft-p4*.mjs
      - integrations/gridcraft/p4-edge*.ts
      - integrations/gridcraft/P4_SQL_CANDIDATE.sql
      - integrations/gridcraft/gridcraft_windows_agent.py
      - integrations/gridcraft/gridcraft_outbound_worker.py
      - sites-migration/ai-workbench/gridcraft-p4-site-addon.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-contract:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile P4 candidate (no production access)
        shell: pwsh
        run: |
          python -m py_compile integrations/gridcraft/gridcraft_p4_safe_write.py integrations/gridcraft/gridcraft_p4_desktop.py integrations/gridcraft/test_p4_safe_write.py
          if ($LASTEXITCODE -ne 0) { throw "P4 Python compile FAILED" }
      - name: Run P4 isolated synthetic workbook safety tests
        shell: pwsh
        run: |
          python integrations/gridcraft/test_p4_safe_write.py
          python integrations/gridcraft/test_p4_desktop.py
          if ($LASTEXITCODE -ne 0) { throw "P4 safe write tests FAILED" }
          python integrations/gridcraft/test_p4_desktop.py
          if ($LASTEXITCODE -ne 0) { throw "P4 desktop socket tests FAILED" }
          python integrations/gridcraft/test_windows_agent.py
          if ($LASTEXITCODE -ne 0) { throw "P4 Windows agent tests FAILED" }
      - name: Confirm P3 read-only regression
        shell: pwsh
        run: |
          python integrations/gridcraft/test_desktop_local.py
          if ($LASTEXITCODE -ne 0) { throw "P3 desktop local tests FAILED" }
          python integrations/gridcraft/test_outbound_worker.py
          if ($LASTEXITCODE -ne 0) { throw "P3 outbound worker tests FAILED" }

  linux-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: P4 security tests independent of Windows desktop
        run: |
          python -m py_compile integrations/gridcraft/gridcraft_p4_safe_write.py integrations/gridcraft/gridcraft_p4_desktop.py
          python integrations/gridcraft/test_p4_safe_write.py

  node-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: P4 MCP tool contract and P3 Site regression
        run: |
          node --test integrations/gridcraft/gridcraft-p4-contract.test.mjs integrations/gridcraft/gridcraft-p4-site.test.mjs
          node --test integrations/gridcraft/p3-site-bridge.test.mjs

  edge-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check P4 Edge candidate without deployment
        run: deno check integrations/gridcraft/p4-edge-v4-candidate.ts integrations/gridcraft/p4-edge.test.ts
      - name: Run isolated owner-verified Edge tests
        run: deno test --allow-env integrations/gridcraft/p4-edge.test.ts

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone P4 candidate Windows EXE
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller install failed" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LizhiGridCraftAgentP4Candidate --paths integrations/gridcraft integrations/gridcraft/gridcraft_windows_agent.py
          if ($LASTEXITCODE -ne 0) { throw "P4 Windows EXE build FAILED" }
          $exe = (Resolve-Path "dist/LizhiGridCraftAgentP4Candidate.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "P4 packaged EXE self-test failed" }
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() | Out-File -Encoding ascii dist/SHA256.txt
          Write-Host "PASS: P4 unsigned Windows candidate packaged and self-tested"
      - uses: actions/upload-artifact@v4
        with:
          name: LizhiGridCraftAgent-P4-candidate-unsigned
          path: |
            dist/LizhiGridCraftAgentP4Candidate.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7
