name: English Academy P6 isolated completion tests
on:
  pull_request:
    paths:
      - 'english-academy/**'
      - '.github/workflows/english-academy-p6-ci.yml'
permissions:
  contents: read

jobs:
  p6-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate JS syntax
        run: |
          node --check english-academy/p6/practice-engine.mjs
          node --check english-academy/p6/sample-bank.mjs
          node --check english-academy/p6/diagnostic-engine.mjs
          node --check english-academy/p6/preview/app.mjs
          node --check english-academy/p6/tests/practice-diagnostic.test.mjs
          node --check english-academy/p6/tests/browser.test.mjs
      - name: Run P6 exercise, human-review and diagnostic contracts
        run: node --test english-academy/p6/tests/practice-diagnostic.test.mjs

  p6-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test-only Chromium
        working-directory: english-academy
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify real P6 UI on 360px phone simulation and desktop
        run: node --test english-academy/p6/tests/browser.test.mjs
      - name: Retain screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-p6-browser-synthetic
          path: english-academy/p6/test-results/
          if-no-files-found: ignore
          retention-days: 7

  p6-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: temporary-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Test P6 migration on disposable PostgreSQL 17 only
        run: |
          set -euo pipefail
          CID=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -1)
          test -n "$CID"
          docker exec -i "$CID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < english-academy/tests/postgres-fixture.sql
          docker exec -i "$CID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < english-academy/schema/20261115_p1_candidate.sql
          docker exec -i "$CID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < english-academy/tests/postgres-rls.test.sql
          docker exec -i "$CID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < english-academy/p5/schema/20261115_p5_aggregate_candidate.sql
          docker exec -i "$CID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < english-academy/p5/tests/postgres-aggregate-fixture.sql
          docker exec -i "$CID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < english-academy/p6/schema/20261115_p6_learning_candidate.sql
          docker exec -i "$CID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < english-academy/p6/tests/postgres-p6.test.sql
