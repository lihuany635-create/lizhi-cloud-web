name: LiZhi CAD Fast Browser Smoke (prior pinned WASM artifact)
on:
  push:
    branches: [feature/embed-lizhi-cad-local-v1]
    paths:
      - 'tests/cad-browser-e2e.cjs'
      - 'tests/cad-opfs-persistence-e2e.cjs'
      - '.github/workflows/cad-embedded-browser-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-portal-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download verified pinned CADCraft build candidate
        uses: actions/download-artifact@v4
        with:
          name: lizhi-cad-integrated-runtime-candidate
          repository: lihuany635-create/lizhi-cloud-web
          run-id: 40119011236
          github-token: ${{ github.token }}
          path: cad/runtime
      - name: Verify pinned source manifest and JS/WASM
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("cad/runtime")
          assert (p/"index.html").is_file()
          assert list(p.glob("*.js")) and list(p.glob("*.wasm"))
          m=json.loads((p/"build-source.json").read_text())
          assert m["sourceSha"] == "19e09447345750eaedd33db7a86fbeff3af1210f"
          assert m["remoteCadWorker"] is False
          print("Cached WASM is source-verified. Portal host code is tested from the current branch.")
          PY
      - name: Install real Chromium
        run: |
          npm install --prefix tests/cad-browser-deps --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          tests/cad-browser-deps/node_modules/.bin/playwright install --with-deps chromium
      - name: Open original portal with real CADCraft WebAssembly and test revisions
        env:
          NODE_PATH: ${{ github.workspace }}/tests/cad-browser-deps/node_modules
          CAD_TEST_ORIGIN: http://127.0.0.1:8771
          CAD_BROWSER_EVIDENCE: cad-browser-evidence
        run: |
          set -euo pipefail
          node --check tests/cad-browser-e2e.cjs
          python3 -m http.server 8771 --bind 127.0.0.1 --directory . > /tmp/cad-portal-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8771/index.html > /dev/null; then break; fi
            sleep 1
          done
          node tests/cad-browser-e2e.cjs
          node tests/cad-opfs-persistence-e2e.cjs
      - name: Upload Chromium real-engine acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lizhi-cad-fast-browser-e2e
          path: cad-browser-evidence/
          retention-days: 14
          if-no-files-found: warn
