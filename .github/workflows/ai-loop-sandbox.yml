name: AI loop isolated sandbox tests
on:
  pull_request:
    paths:
      - 'experimental/ai-loop/**'
      - 'production/source/lib/ai-loop-v15.mjs'
      - 'production/source/lib/ai-loop-compact.mjs'
      - 'production/source/backend/index.ts'
      - 'production/source/app/api/ai-loop/route.ts'
      - 'production/source/sql/ai-loop-v15-candidate.sql'
      - '.github/workflows/ai-loop-sandbox.yml'
      - 'docs/ai-loop/P5_REPRODUCIBLE_EVIDENCE_v1.0.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-node:
    name: P1-P5 offline acceptance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Confirm Node runtime
        run: node --version
      - name: Check candidate Site route syntax (no deployment)
        run: node --experimental-strip-types --check production/source/app/api/ai-loop/route.ts
      - name: Check candidate Bridge handler syntax (no deployment)
        run: node --experimental-strip-types --check production/source/backend/index.ts
      - name: Check compact source module syntax (no deployment)
        run: node --check production/source/lib/ai-loop-compact.mjs
      - name: Run actual candidate Bridge handler with mocked owner-scoped Supabase (no network)
        run: node --disable-warning=ExperimentalWarning --experimental-transform-types experimental/ai-loop/compact-bridge-handler.mjs
      - name: Run offline tests and create sanitised evidence
        run: node --disable-warning=ExperimentalWarning experimental/ai-loop/acceptance-evidence.mjs --output ai-loop-acceptance-evidence.json
      - name: Validate AUTH01-AUTH10 mock-only evidence
        run: node --disable-warning=ExperimentalWarning experimental/ai-loop/auth-evidence.mjs --output ai-loop-auth-evidence.json
      - name: Save sandbox evidence (3-day retention)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-loop-p5-sandbox-evidence
          path: |
            ai-loop-acceptance-evidence.json
            ai-loop-auth-evidence.json
          retention-days: 3
