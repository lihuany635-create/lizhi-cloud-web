name: GridCraft v0.5.5 Windows agent packaging
on:
  pull_request:
    paths:
      - 'integrations/gridcraft/**'
      - '.github/workflows/gridcraft-v055-windows-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned packaging tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw "INSTALL_FAILED" }
      - name: Compile sources
        shell: pwsh
        run: |
          python -m compileall -q integrations/gridcraft
          if ($LASTEXITCODE -ne 0) { throw "COMPILE_FAILED" }
      - name: v0.5.5 and previous worker/agent suites
        shell: pwsh
        run: |
          $tests = @("test_readonly_v055.py","test_desktop_local.py","test_outbound_worker.py",
                     "test_p4_save_worker_route.py","test_p3_worker_route.py","test_p2_worker_route.py",
                     "test_windows_agent.py","test_reconnect_v052.py","test_oneclick_v05.py")
          foreach ($test in $tests) {
            python -m pytest -q "integrations/gridcraft/$test"
            if ($LASTEXITCODE -ne 0) { throw "TEST_FAILED $test" }
          }
      - name: Build versioned EXE and self-test
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LizhiGridCraftAgent_v055 --version-file integrations/gridcraft/version_info_v055.txt --paths integrations/gridcraft integrations/gridcraft/gridcraft_windows_agent.py
          if ($LASTEXITCODE -ne 0) { throw "EXE_BUILD_FAILED" }
          $exe = (Resolve-Path "dist/LizhiGridCraftAgent_v055.exe").Path
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductVersion -ne "0.5.5" -or $info.FileVersion -ne "0.5.5") { throw "VERSION_RESOURCE_MISMATCH" }
          # --windowed EXE has no console; capture self-test output through a file.
          $out = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru -RedirectStandardOutput $out
          $lines = Get-Content $out
          $lines | Write-Output
          if ($p.ExitCode -ne 0) { throw "EXE_SELF_TEST_FAILED" }
          if (-not ($lines -match '^PASS: LizhiGridCraftAgent 0\.5\.5 read-only inspect/evaluate/read-mode guards$')) { throw "V055_SELF_TEST_MISSING" }
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() | Out-File -Encoding ascii dist/SHA256.txt
      - name: Package install ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/pkg -Force | Out-Null
          Copy-Item dist/LizhiGridCraftAgent_v055.exe dist/pkg/
          Copy-Item dist/SHA256.txt dist/pkg/
          Copy-Item integrations/gridcraft/V055_READONLY_HANDOFF_20261122.md dist/pkg/
          Compress-Archive -Path dist/pkg/* -DestinationPath dist/LizhiGridCraftAgent_v055_Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LizhiGridCraftAgent-v0.5.5-Windows
          path: |
            dist/LizhiGridCraftAgent_v055_Windows.zip
            dist/SHA256.txt
          retention-days: 14
          if-no-files-found: error
