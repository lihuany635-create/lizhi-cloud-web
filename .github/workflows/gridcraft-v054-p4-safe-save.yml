name: GridCraft v0.5.4 P4 Safe Save Copy Candidate
on:
  pull_request:
    paths:
      - 'integrations/gridcraft/**'
      - '.github/workflows/gridcraft-v054-p4-safe-save.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install v0.5.3 test dependency
        run: python -m pip install pytest
      - name: Syntax check
        run: python -m py_compile integrations/gridcraft/gridcraft_p4_safe_save.py integrations/gridcraft/test_p4_safe_save.py integrations/gridcraft/test_p4_save_worker_route.py
      - name: P4 safe export and malicious path checks
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p4_safe_save.py' -v
      - name: Optional native GridCraft CLI read-only probe isolation tests
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p4_native_read_probe.py' -v
      - name: P4 authenticated worker routing tests
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p4_save_worker_route.py' -v
      - name: P3 format safety tests
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p3_format.py' -v
      - name: P3 desktop and worker routing tests
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p3_desktop.py' -v
      - name: P3 worker routing tests
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p3_worker_route.py' -v
      - name: P2 batch and routing tests
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p2_batch.py' -v
      - name: P2 worker routing tests
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p2_worker_route.py' -v
      - name: P1 source XLSX fidelity tests
        run: python -m unittest discover -s integrations/gridcraft -p 'test_xlsx_fidelity.py' -v
      - name: Existing P4 cell write safety tests
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p4_safe_write.py' -v
      - name: Windows-only v0.5.3 reliability regression
        if: runner.os == 'Windows'
        run: python -m pytest integrations/gridcraft/test_v053_reliability.py -q

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated Windows candidate
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --clean --noconfirm --onefile --name LizhiGridCraftAgent integrations/gridcraft/gridcraft_windows_agent.py
      - name: Verify packaged P4 routing
        shell: pwsh
        run: |
          $result = & .\dist\LizhiGridCraftAgent.exe --self-test
          $result | Write-Output
          # Version-agnostic from v0.5.4 on; -match on an array returns matching lines.
          if ($LASTEXITCODE -ne 0 -or -not ($result -match '^PASS: LizhiGridCraftAgent 0\.5\.[4-9] P4 save routes and packaging$')) {
            throw 'Packaged GridCraft P4 smoke test failed'
          }
      - name: Upload Windows candidate for this run
        uses: actions/upload-artifact@v4
        with:
          name: LizhiGridCraftAgent-v0.5.4-candidate
          path: dist/LizhiGridCraftAgent.exe
          if-no-files-found: error


  windows-native-p4:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real GridCraft control socket and P4 copy save
        shell: pwsh
        run: |
          $url = 'https://github.com/storytold/gridcraft/releases/download/v0.19.1/gridcraft-0.19.1-windows-x64-portable.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'gridcraft-0.19.1.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'gridcraft-p4-portable'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($digest -ne '0b4bf8535f4904fac654326a360ff6d74ea6f4d184a8257c106388fafe74c9ac') {
            throw 'GridCraft release checksum differed'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          $exe = @(Get-ChildItem -LiteralPath $folder -Recurse -File -Filter 'gridcraft.exe')
          if ($exe.Count -ne 1) { throw 'Expected one portable GridCraft executable' }
          python integrations/gridcraft/p4_windows_native_acceptance.py $exe[0].FullName
