name: Finance MCP checks
on:
  pull_request:
    paths:
      - "supabase/functions/lizhi-finance-mcp/**"
      - "tests/finance-mcp-contract.test.mjs"
      - ".github/workflows/finance-mcp-checks.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - name: Type check OAuth MCP endpoint
        run: deno check --node-modules-dir=auto supabase/functions/lizhi-finance-mcp/index.ts
      - name: Reject unauthenticated live MCP traffic
        run: |
          set -eu
          code=$(curl --max-time 20 -sS -o /tmp/finance-mcp-public-response -w '%{http_code}' 'https://hrdzywkihfqggiwjgavi.supabase.co/functions/v1/lizhi-finance-mcp')
          echo "Anonymous status: $code"
          test "$code" = "401"
      - name: Check finance read-only security contract
        run: node --test tests/finance-mcp-contract.test.mjs
