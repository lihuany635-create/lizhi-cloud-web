name: RG Publish Academy V12 Furniture Review In Original GLB
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-academy-v12-promote-main.yml'
      - 'model-viewer/revisions/academy-interior-v12/promote_v12_to_main.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rg-academy-v12-canonical-promotion
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: rg-ep01-s01-stage-20261023
          path: .academy-stage
          persist-credentials: false
      - name: Verify immutable source, furniture placement QA and stage original academy
        run: |
          set -euo pipefail
          python .academy-stage/model-viewer/revisions/academy-interior-v12/promote_v12_to_main.py
      - name: Assert exactly original academy files changed
        run: |
          python - <<'PY'
          import subprocess
          allowed={
           'model-viewer/lahudi-academy.glb',
           'model-viewer/current-models.json',
           'model-viewer/index.html',
           'model-viewer/backups/pre-academy-v12-interior-furniture/lahudi-academy.glb'}
          seen=set()
          for line in subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines():
           path=line[3:]
           if path.startswith('.academy-stage/'):continue
           seen.add(path)
          assert seen==allowed,{'actual':seen,'allowed':allowed}
          PY
      - name: Commit the single official GLB V12 and backup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-viewer/lahudi-academy.glb model-viewer/current-models.json model-viewer/index.html model-viewer/backups/pre-academy-v12-interior-furniture/lahudi-academy.glb
          git commit -m 'feat(academy V12): furnished school room preview, two stair cores and floor-aware views'
          git push origin HEAD:refs/heads/main
