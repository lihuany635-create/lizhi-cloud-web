name: RG EP01 S01 Candidate Review
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - 'model-viewer/revisions/ep01-s01/**'
      - '.github/workflows/rg-ep01-s01-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-s01-corridor-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated stage branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build structural GLB with S01 assets only
        run: |
          python model-viewer/revisions/ep01-s01/scripts/enhance_s01_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("candidate-output/report_v2.json").read_text())
          v=r["validation"]
          assert v["binary_container"]=="PASS"
          assert v["all_source_nodes_preserved"]=="PASS"
          assert v["existing_transforms_unchanged"]=="PASS"
          assert v["S06_modified"] is False
          assert v["animation_camera_overlay"]=="NOT_RUN"
          assert r["new_detail_groups"]["ribs"]==56
          print("Review candidate GLB",r["glb_sha256"],"new nodes",r["added_nodes_stage2"])
          PY
      - name: Add continuous Gothic stone-vault and glazing to S01 candidate
        run: |
          python model-viewer/revisions/ep01-s01/scripts/enhance_s01_v3.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("candidate-output/report_v3.json").read_text())
          assert r["stage3_added_nodes"]==92
          assert r["validation"]["glb_roundtrip"]=="PASS"
          assert r["validation"]["S06_unchanged"] is True
          assert r["validation"]["animation_camera_match"]=="NOT_RUN"
          print("S01 V3 candidate complete",r["result_sha256"],r["total_new_nodes"])
          PY
      - name: Install QA image dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Render geometry-only perspective and topology guide
        run: python model-viewer/revisions/ep01-s01/scripts/preview_s01_v2.py
      - name: Remove transient stage 1 duplication from artifact
        run: rm -f candidate-output/stage1.glb
      - name: Preserve candidate in isolated stage branch (never edit canonical model)
        run: |
          mkdir -p model-viewer/staged-output/ep01-s01
          cp candidate-output/lahudi-academy_ep01_s01_corridor_v3_review.glb model-viewer/staged-output/ep01-s01/
          cp candidate-output/s01_corridor_v3_geometry_preview.png model-viewer/staged-output/ep01-s01/
          cp candidate-output/report_v3.json model-viewer/staged-output/ep01-s01/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-viewer/staged-output/ep01-s01/
          if ! git diff --cached --quiet; then
            git commit -m 'artifact(S01): preserve review-only model and QA output on stage branch'
            git push origin HEAD:refs/heads/rg-ep01-s01-stage-20261023
          fi
      - name: Upload S01 V3 candidate GLB and reports, not to production
        uses: actions/upload-artifact@v4
        with:
          name: rg-ep01-s01-gothic-corridor-v3-glb-preview
          path: |
            candidate-output/lahudi-academy_ep01_s01_corridor_v3_review.glb
            candidate-output/s01_corridor_v3_geometry_preview.png
            candidate-output/report_v3.json
            candidate-output/stage1_report.json
          retention-days: 30
