name: RG Academy V9 Locked Plan Static Architecture QA
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - 'model-viewer/staged-output/academy-locked-plan-v9/report.json'
      - '.github/workflows/rg-academy-v9-static-architecture-qa.yml'
      - 'model-viewer/revisions/academy-locked-plan-v9/verify_structural_shell_v9.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify real wall openings, shared piers, roofed walkway and static collision envelope
        run: |
          set -euo pipefail
          python model-viewer/revisions/academy-locked-plan-v9/verify_structural_shell_v9.py
      - name: Save structural QA evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-viewer/staged-output/academy-locked-plan-v9/structure-qa.json
          if ! git diff --cached --quiet; then
            git commit -m 'qa(academy V9): verify locked plan and true structural openings'
            git pull --rebase origin rg-ep01-s01-stage-20261023
            git push origin HEAD:refs/heads/rg-ep01-s01-stage-20261023
          fi
