name: RG EP01 S01 Clean Sheet Rebuild RB2
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-s01-clean-sheet-rebuild-rb2.yml'
      - 'model-viewer/revisions/ep01-s01/scripts/build_s01_clean_sheet_v2.py'
      - 'model-viewer/revisions/ep01-s01/viewer/clean_sheet_v2.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rg-s01-clean-sheet-rebuild-rb2
  cancel-in-progress: true
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry tools
        run: python -m pip -q install "trimesh>=4.8,<5" "numpy>=1.26,<3" "pillow>=11"
      - name: Build a complete independent S01 Gothic Academy hallway GLB
        run: |
          set -euo pipefail
          python model-viewer/revisions/ep01-s01/scripts/build_s01_clean_sheet_v2.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          rep=json.loads(Path('candidate-output/s01-rebuild-v2/report.json').read_text())
          blob=Path('candidate-output/s01-rebuild-v2')/rep['model']
          assert blob.read_bytes()[:4]==b'glTF'
          assert len(blob.read_bytes())==rep['model_bytes']
          assert hashlib.sha256(blob.read_bytes()).hexdigest()==rep['sha256']
          assert rep['mesh_count']>300 and rep['central_stair_steps']==16
          assert rep['S06_modified'] is False
          print('CLEAN-SHEET GLB VERIFIED:',rep['sha256'])
          PY
      - name: Prepare isolated WebGL test
        run: |
          mkdir -p candidate-output/s01-rebuild-v2/preview
          cp model-viewer/revisions/ep01-s01/viewer/clean_sheet_v2.html candidate-output/s01-rebuild-v2/preview/index.html
          cp candidate-output/s01-rebuild-v2/lahudi-academy_ep01_s01_REBUILT_v2.glb candidate-output/s01-rebuild-v2/preview/
      - name: Render real GLB in headless browser
        run: |
          set -euo pipefail
          python3 -m http.server 8165 --bind 127.0.0.1 --directory candidate-output/s01-rebuild-v2/preview > candidate-output/s01-rebuild-v2/http.log 2>&1 &
          sleep 3
          CHROME="$(command -v google-chrome || command -v chromium)"
          timeout 115s "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --enable-webgl \
            --window-size=1440,900 --virtual-time-budget=26000 \
            --screenshot=candidate-output/s01-rebuild-v2/rb2-webgl.png http://127.0.0.1:8165/
          test "$(stat -c %s candidate-output/s01-rebuild-v2/rb2-webgl.png)" -gt 50000
      - name: Store stage-only GLB and QA report
        run: |
          set -euo pipefail
          dst=model-viewer/staged-output/ep01-s01/rebuild-rb2
          mkdir -p "$dst"
          cp candidate-output/s01-rebuild-v2/lahudi-academy_ep01_s01_REBUILT_v2.glb "$dst/"
          cp candidate-output/s01-rebuild-v2/report.json "$dst/"
          cp candidate-output/s01-rebuild-v2/rb2-webgl.png "$dst/"
          cp model-viewer/revisions/ep01-s01/viewer/clean_sheet_v2.html "$dst/index.html"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          if ! git diff --cached --quiet; then
            git commit -m 'artifact(S01 RB2): new Gothic school GLB from scratch and actual WebGL QA'
            git pull --rebase origin rg-ep01-s01-stage-20261023
            git push origin HEAD:refs/heads/rg-ep01-s01-stage-20261023
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rg-ep01-s01-clean-sheet-rb2-model-qa
          path: |
            candidate-output/s01-rebuild-v2/report.json
            candidate-output/s01-rebuild-v2/rb2-webgl.png
          retention-days: 30
