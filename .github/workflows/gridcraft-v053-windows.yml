name: GridCraft v0.5.3 Windows packaging and safety
on:
  push:
    branches: [feat/gridcraft-v053-windows-reliability-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-v053:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test and packaging tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2 pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw "INSTALL_FAILED" }
      - name: Compile complete GridCraft Windows sources
        shell: pwsh
        run: |
          python -m compileall -q integrations/gridcraft
          if ($LASTEXITCODE -ne 0) { throw "COMPILE_FAILED" }
      - name: Run new v0.5.3 pytest suite
        shell: pwsh
        run: |
          python -m pytest -q integrations/gridcraft/test_v053_reliability.py
          if ($LASTEXITCODE -ne 0) { throw "V053_PYTEST_FAILED" }
      - name: Run previous P3 P4 and Windows safety suites
        shell: pwsh
        run: |
          $tests = @(
            "test_reconnect_v052.py",
            "test_autostart_v051.py",
            "test_oneclick_v05.py",
            "test_windows_agent.py",
            "test_desktop_local.py",
            "test_outbound_worker.py",
            "test_p4_safe_write.py",
            "test_p4_desktop.py"
          )
          foreach ($test in $tests) {
            python "integrations/gridcraft/$test"
            if ($LASTEXITCODE -ne 0) { throw "REGRESSION_FAILED $test" }
          }
      - name: Build versioned Win11 EXE and self-test
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LizhiGridCraftAgent_v053 --version-file integrations/gridcraft/version_info_v053.txt --paths integrations/gridcraft integrations/gridcraft/gridcraft_windows_agent.py
          if ($LASTEXITCODE -ne 0) { throw "EXE_BUILD_FAILED" }
          $exe = (Resolve-Path "dist/LizhiGridCraftAgent_v053.exe").Path
          $result = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "EXE_SELF_TEST_FAILED" }
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() | Out-File -Encoding ascii dist/SHA256.txt
      - name: Package all full source modules, pytest and docs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/source -Force | Out-Null
          $fullSource = @(
            "gridcraft_windows_agent.py",
            "gridcraft_win_lifecycle.py",
            "gridcraft_desktop_local.py",
            "gridcraft_outbound_worker.py",
            "gridcraft_p4_safe_write.py",
            "gridcraft_p4_desktop.py",
            "gridcraft_pairing_client.py",
            "test_v053_reliability.py",
            "version_info_v053.txt",
            "V053_EDGE_POLL_HEARTBEAT_LONGPOLL_SPEC.md",
            "V053_HANDOFF_QA_20261119.md"
          )
          foreach ($file in $fullSource) {
            Copy-Item "integrations/gridcraft/$file" "dist/source/$file"
          }
          Compress-Archive -Path dist/source -DestinationPath dist/LizhiGridCraft_v053_FullSource.zip -Force
          if (-not (Test-Path dist/LizhiGridCraft_v053_FullSource.zip)) { throw "FULL_SOURCE_FAILED" }
      - uses: actions/upload-artifact@v4
        with:
          name: GridCraft-v053-FullSource-Windows-EXE
          path: |
            dist/LizhiGridCraftAgent_v053.exe
            dist/LizhiGridCraft_v053_FullSource.zip
            dist/SHA256.txt
          retention-days: 14
          if-no-files-found: error
