name: RG Academy V13 Publish True Campus Main Gate
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-academy-v13-publish.yml'
      - 'model-viewer/revisions/academy-gate-v13/promote_gate_v13_to_main.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rg-academy-v13-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: rg-ep01-s01-stage-20261023
          path: .academy-stage
          persist-credentials: false
      - name: Move verified V13 existing-campus GLB to main after backing up V12
        run: |
          set -euo pipefail
          python .academy-stage/model-viewer/revisions/academy-gate-v13/promote_gate_v13_to_main.py
      - name: Ensure only four authorized V13 files were edited
        run: |
          python - <<'PY'
          import subprocess
          expected={
           'model-viewer/lahudi-academy.glb',
           'model-viewer/current-models.json',
           'model-viewer/index.html',
           'model-viewer/backups/pre-academy-v13-campus-gate/lahudi-academy.glb'
          }
          changed=set()
          for row in subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines():
           path=row[3:]
           if path.startswith('.academy-stage/'):continue
           changed.add(path)
          assert changed==expected,{'expected':expected,'actual':changed}
          PY
      - name: Release one and only canonical school GLB
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-viewer/lahudi-academy.glb model-viewer/current-models.json model-viewer/index.html model-viewer/backups/pre-academy-v13-campus-gate/lahudi-academy.glb
          git commit -m 'feat(academy V13): add real Gothic school gate, forecourt, guardhouse and entrance view'
          git push origin HEAD:refs/heads/main
