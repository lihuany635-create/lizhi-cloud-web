name: RG Academy Exterior V5 Prepromotion Geometry And Color QA
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-academy-exterior-v5-color-qa.yml'
      - 'model-viewer/revisions/academy-all-corridors/qa_rebuilt_exterior_v5.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check precise interior footprint preserved and contrast PBR
        run: |
          set -euo pipefail
          python model-viewer/revisions/academy-all-corridors/qa_rebuilt_exterior_v5.py
      - name: Commit nonrendering QA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-viewer/staged-output/academy-exterior-rebuild-v5/qa.json
          if ! git diff --cached --quiet; then
            git commit -m 'qa(academy V5): pass full rebuild massing and material color audit'
            git pull --rebase origin rg-ep01-s01-stage-20261023
            git push origin HEAD:refs/heads/rg-ep01-s01-stage-20261023
          fi
