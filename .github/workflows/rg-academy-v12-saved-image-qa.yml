name: RG Academy V12 Saved Interior Screenshot Validation
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-academy-v12-saved-image-qa.yml'
      - 'model-viewer/revisions/academy-interior-v12/qa_saved_visual_v12.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate real saved 3D cutaway screenshots and five different UI selections
        run: |
          set -euo pipefail
          python model-viewer/revisions/academy-interior-v12/qa_saved_visual_v12.py
      - name: Keep formal visual QA manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-viewer/staged-output/academy-interior-furniture-v12/interior-visual-qa/screenshot-validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'qa(academy V12): five public furniture view screenshots verified'
            git pull --rebase origin rg-ep01-s01-stage-20261023
            git push origin HEAD:refs/heads/rg-ep01-s01-stage-20261023
          fi
