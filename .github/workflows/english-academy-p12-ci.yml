name: English Academy P12 production relay checks
on:
  pull_request:
    paths:
      - 'english-academy/p12/**'
      - 'supabase/functions/lizhi-english-academy/**'
      - 'sites-migration/english-academy-p12/**'
      - '.github/workflows/english-academy-p12-ci.yml'
permissions:
  contents: read
jobs:
  relay-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test english-academy/p12/tests/*.test.mjs english-academy/p11/tests/*.test.mjs english-academy/p3/tests/*.test.mjs english-academy/p6/tests/persistent-adapter.test.mjs english-academy/p7/tests/integration.test.mjs english-academy/p10/tests/integration-security.test.mjs
  postgres-relay:
    runs-on: ubuntu-24.04
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Test private binding and revocation using synthetic data only
        shell: bash
        run: |
          set -euo pipefail
          CID=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -1)
          test -n "$CID"
          run_sql() { docker exec -i "$CID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$1"; }
          run_sql english-academy/tests/postgres-fixture.sql
          run_sql english-academy/schema/20261115_p1_candidate.sql
          run_sql english-academy/tests/postgres-rls.test.sql
          run_sql english-academy/p5/schema/20261115_p5_aggregate_candidate.sql
          run_sql english-academy/p5/tests/postgres-aggregate-fixture.sql
          run_sql english-academy/p6/schema/20261115_p6_learning_candidate.sql
          run_sql english-academy/p7/schema/20261115_p7_owner_link_and_consent_candidate.sql
          docker exec -i "$CID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "create table auth.sessions(id uuid primary key,user_id uuid not null,not_after timestamptz);"
          run_sql english-academy/p11/schema/20261115_p11_web_cards_candidate.sql
          run_sql english-academy/p12/tests/postgres-relay-fixture.sql
          run_sql english-academy/p12/schema/20261115_site_relay.sql
          run_sql english-academy/p12/tests/postgres-relay.test.sql
  edge-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/lizhi-english-academy/index.ts
