name: GridCraft Site v31 no approval page (candidate)
on:
  push:
    branches:
      - fix/gridcraft-site-no-approval-v31-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-owner-no-click:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Test no-page commit contract and original P3 P4 security guards
        run: |
          node --test integrations/gridcraft/gridcraft-v05-no-click-site.test.mjs
          node --test integrations/gridcraft/gridcraft-p4-site.test.mjs
          node --test integrations/gridcraft/gridcraft-p4-contract.test.mjs
          node --test integrations/gridcraft/p3-site-bridge.test.mjs
