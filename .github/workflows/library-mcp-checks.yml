name: Library MCP checks

on:
  pull_request:
    paths:
      - "supabase/functions/library-mcp/**"
      - "supabase/migrations/*library_readonly_mcp.sql"
      - "supabase/migrations/*library_mcp_owner_actions.sql"
      - "oauth/consent/**"
      - "tests/library-mcp-contract.test.mjs"
      - "tests/library-mcp-owner-actions.test.mjs"
      - "tests/library-owner-tools-deno.test.ts"
      - ".github/workflows/library-mcp-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - name: Check Edge Function types and pinned dependencies
        run: deno check --frozen --node-modules-dir=auto supabase/functions/library-mcp/index.ts
      - name: Test owner operation handlers without writing production data
        run: deno test --frozen --node-modules-dir=auto tests/library-owner-tools-deno.test.ts
      - name: Check OAuth page and security contract
        run: |
          node --check oauth/consent/consent.js
          node --test tests/library-mcp-contract.test.mjs tests/library-mcp-owner-actions.test.mjs
