name: GridCraft Windows local agent package

on:
  push:
    branches:
      - feat/gridcraft-mcp-p0-20261118
    paths:
      - .github/workflows/gridcraft-windows-agent.yml
      - integrations/gridcraft/gridcraft_windows_agent.py
      - integrations/gridcraft/gridcraft_desktop_local.py
      - integrations/gridcraft/test_windows_agent.py
      - integrations/gridcraft/test_desktop_local.py
      - integrations/gridcraft/WINDOWS_AGENT_README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-agent:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout original draft branch
        uses: actions/checkout@v4

      - name: Install Python for Windows
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Windows agent security tests
        shell: pwsh
        run: |
          python -m py_compile integrations/gridcraft/gridcraft_desktop_local.py integrations/gridcraft/gridcraft_windows_agent.py integrations/gridcraft/test_windows_agent.py
          python integrations/gridcraft/test_desktop_local.py
          if ($LASTEXITCODE -ne 0) { throw "Loopback tests FAILED" }
          python integrations/gridcraft/test_windows_agent.py
          if ($LASTEXITCODE -ne 0) { throw "Windows agent tests FAILED" }

      - name: Build standalone user-executable GUI
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller install failed" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name LizhiGridCraftAgent --paths integrations/gridcraft integrations/gridcraft/gridcraft_windows_agent.py
          if ($LASTEXITCODE -ne 0) { throw "Windows EXE build failed" }
          if (!(Test-Path "dist/LizhiGridCraftAgent.exe")) { throw "EXE not produced" }

      - name: Check packaged EXE without opening any private data
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/LizhiGridCraftAgent.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged EXE --self-test failed ($($p.ExitCode))" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LizhiGridCraftAgent.exe" | Out-File -Encoding ascii dist/SHA256.txt
          Copy-Item "integrations/gridcraft/WINDOWS_AGENT_README.md" "dist/README.txt"
          Write-Host "PASS: Windows standalone EXE self-test; SHA256 $hash"

      - name: Upload the EXE as unsigned preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: LizhiGridCraftAgent-Windows-v0.1-unsigned
          path: |
            dist/LizhiGridCraftAgent.exe
            dist/SHA256.txt
            dist/README.txt
          if-no-files-found: error
          retention-days: 7
