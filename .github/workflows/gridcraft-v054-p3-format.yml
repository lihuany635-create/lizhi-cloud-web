name: GridCraft v0.5.4 P3 Protected Format Candidate
on:
  pull_request:
    paths:
      - 'integrations/gridcraft/**'
      - '.github/workflows/gridcraft-v054-p3-format.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile P3 candidate and existing adapters
        run: python -m compileall -q integrations/gridcraft
      - name: P3 format compiler, merge guards and durable receipts (synthetic)
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p3_format.py' -v
      - name: P3 localhost scoped command adapter (synthetic)
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p3_desktop.py' -v
      - name: Existing P2 batch and worker routing regression
        run: |
          python -m unittest discover -s integrations/gridcraft -p 'test_p2_batch.py' -v
          python -m unittest discover -s integrations/gridcraft -p 'test_p2_worker_route.py' -v
      - name: Existing P1 fidelity regression
        run: python -m unittest discover -s integrations/gridcraft -p 'test_xlsx_fidelity.py' -v
      - name: Existing P4 safety regression
        run: python -m unittest discover -s integrations/gridcraft -p 'test_p4_safe_write.py' -v
      - name: Install pytest for original Windows lifecycle regression
        if: runner.os == 'Windows'
        run: python -m pip install pytest
      - name: Original v0.5.3 Windows lifecycle regression
        if: runner.os == 'Windows'
        run: python -m pytest integrations/gridcraft/test_v053_reliability.py -q
