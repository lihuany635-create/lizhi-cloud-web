name: RG Promote High Contrast Academy V8 Canonical
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-academy-v8-promote-main.yml'
      - 'model-viewer/revisions/academy-all-corridors/promote_contrast_v8.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rg-academy-v8-canonical-contrast
  cancel-in-progress: true
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          ref: rg-ep01-s01-stage-20261023
          path: .academy-stage
          persist-credentials: false
      - name: Promote true high contrast model to same original GLB
        run: python .academy-stage/model-viewer/revisions/academy-all-corridors/promote_contrast_v8.py
      - name: Ensure only school model, viewer and backup changed
        run: |
          python - <<'PY'
          import subprocess
          need={'model-viewer/lahudi-academy.glb','model-viewer/index.html',
                'model-viewer/current-models.json',
                'model-viewer/backups/pre-academy-v8-color-contrast/lahudi-academy.glb'}
          changed=set()
          for line in subprocess.check_output(['git','status','--porcelain','--untracked-files=all'],text=True).splitlines():
            p=line[3:]
            if p.startswith('.academy-stage/'):continue
            changed.add(p)
          assert need==changed,{'actual':changed,'expected':need}
          PY
      - name: Commit one version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-viewer/lahudi-academy.glb model-viewer/index.html model-viewer/current-models.json model-viewer/backups/pre-academy-v8-color-contrast/lahudi-academy.glb
          git commit -m 'style(academy V8): fix washed-out whole-school colors while preserving optimized Gothic campus'
          git push origin HEAD:refs/heads/main
