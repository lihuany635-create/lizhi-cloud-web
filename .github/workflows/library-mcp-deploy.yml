name: Library MCP deploy (manual)

# 只能由本人在 GitHub Actions 頁面手動按 Run 觸發；不會自動部署。
# 需要 repo Secret：SUPABASE_ACCESS_TOKEN（Supabase 帳號的個人存取權杖）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的分支或 commit"
        required: true
        default: "feature/library-mcp-owner-actions-20261103"
      confirm:
        description: "輸入 DEPLOY 確認部署到正式環境"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: library-mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: hrdzywkihfqggiwjgavi
    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirm != 'DEPLOY' }}
        run: |
          echo "沒有輸入 DEPLOY，取消部署。"
          exit 1

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6

      - name: Type check before deploy
        run: deno check --frozen --node-modules-dir=auto supabase/functions/library-mcp/index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy library-mcp (verify_jwt stays off for OAuth discovery)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "缺少 SUPABASE_ACCESS_TOKEN Secret，請先到 repo Settings → Secrets and variables → Actions 新增。"
            exit 1
          fi
          supabase functions deploy library-mcp --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
