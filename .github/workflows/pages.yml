name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble reviewed Hades v2.4 model
        run: |
          python - <<'PY'
          import pathlib,json,gzip,hashlib
          root=pathlib.Path('model-viewer/revisions/hades-v2.4/transfer')
          m=json.loads((root/'manifest.json').read_text())
          archive=b''.join((root/name).read_bytes() for name in m['parts'])
          assert hashlib.sha256(archive).hexdigest()==m['compressed_sha256']
          data=gzip.decompress(archive)
          assert hashlib.sha256(data).hexdigest()==m['model_sha256']
          target=pathlib.Path('model-viewer/hades-house.glb')
          assert hashlib.sha256(target.read_bytes()).hexdigest() in [m['previous_sha256'],m['model_sha256']], 'Unexpected house source'
          target.write_bytes(data)
          print('Verified exact HADES-v2.4 deployment model:',len(data),'bytes')
          PY
      - name: Publish isolated EP01 S01 V5 preview model from stage branch
        uses: actions/checkout@v4
        with:
          repository: lihuany635-create/lizhi-cloud-web
          ref: rg-ep01-s01-stage-20261023
          path: .s01-stage-publish
          persist-credentials: false
      - name: Verify and stage V5 preview (do not overwrite canonical academy)
        run: |
          python - <<'PY'
          import json,hashlib,pathlib,shutil
          root=pathlib.Path('.s01-stage-publish/model-viewer/staged-output/ep01-s01/v5')
          manifest=json.loads((root/'report_v5.json').read_text())
          source=root/'lahudi-academy_ep01_s01_corridor_v5_art_review.glb'
          payload=source.read_bytes()
          actual=hashlib.sha256(payload).hexdigest()
          assert actual==manifest['sha256'], 'S01 V5 SHA mismatch'
          assert len(payload)==manifest['bytes'], 'S01 V5 byte length mismatch'
          assert payload[:4]==b'glTF', 'S01 V5 is not GLB'
          assert manifest['S06_untouched'] is True
          assert manifest['author_acceptance']=='PENDING'
          target=pathlib.Path('model-viewer/preview')
          target.mkdir(parents=True,exist_ok=True)
          (target/'s01-v5.glb').write_bytes(payload)
          (target/'s01-v5-status.json').write_text(json.dumps({
            'project':'現實遊戲','scene':'EP01-S01','version':'S01-V5-TEST',
            'sha256':actual,'bytes':len(payload),
            'author_approval':'PENDING','camera_match':'NOT_RUN',
            'canonical_glb_unchanged':True,
            'source_branch':'rg-ep01-s01-stage-20261023',
            'source_report':manifest,
            'publication':'TEST_PREVIEW_ONLY'
          },ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          print('Published isolated S01 V5 preview:',len(payload),'bytes SHA256',actual)
          PY
          rm -rf .s01-stage-publish
      - name: Checkout pinned S01 V5 candidate into temporary isolated path
        uses: actions/checkout@v4
        with:
          ref: 5c166205ccfc25a8293fce5dcf1a1576c930ec36
          path: _rg_s01_candidate
          sparse-checkout: model-viewer/staged-output/ep01-s01/v5
          persist-credentials: false
      - name: Assemble S01 preview GLB with exact SHA-256 verification
        run: |
          python - <<'PY'
          import hashlib, pathlib, shutil, json
          src=pathlib.Path('_rg_s01_candidate/model-viewer/staged-output/ep01-s01/v5')
          report=json.loads((src/'report_v5.json').read_text(encoding='utf-8'))
          candidate=src/'lahudi-academy_ep01_s01_corridor_v5_art_review.glb'
          target=pathlib.Path('model-viewer/s01-preview/lahudi-academy-s01-v5.glb')
          expected='c875ba7f00814840723615942a523e9617d55457f3943216325b61343461e66e'
          assert report['sha256']==expected, 'Source model report changed'
          assert report['bytes']==5508420,'Unexpected source size'
          assert candidate.stat().st_size==report['bytes'],'Missing or partial S01 GLB'
          assert hashlib.sha256(candidate.read_bytes()).hexdigest()==expected,'S01 source hash mismatch'
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(candidate,target)
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          print('RG S01 preview assembled:',target,'bytes',target.stat().st_size)
          PY
          rm -rf _rg_s01_candidate
      - name: Pin S01 V7 independently of V5 and canonical academy
        uses: actions/checkout@v4
        with:
          ref: 23d7e9dcff72d6e3d339b27a1de98c74690fe6bf
          path: _rg_s01_v7
          sparse-checkout: model-viewer/staged-output/ep01-s01/v7
          persist-credentials: false
      - name: Assemble S01 V7 TEST preview with exact SHA256
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,shutil
          p=pathlib.Path('_rg_s01_v7/model-viewer/staged-output/ep01-s01/v7')
          report=json.loads((p/'report_v7.json').read_text(encoding='utf-8'))
          source=p/'lahudi-academy_ep01_s01_v7_vestibules_review.glb'
          expected='a7c6cf6f9281c2758a450c12d3c0f8c70e9167a7efaaa8a6aba68533c64e11d7'
          assert report['sha256']==expected, 'V7 report integrity mismatch'
          assert report['bytes']==5566760
          assert report['validation']['six_openings_preserved']
          assert report['validation']['no_new_geometry_in_S06']
          data=source.read_bytes()
          assert len(data)==5566760 and data[:4]==b'glTF'
          assert hashlib.sha256(data).hexdigest()==expected, 'V7 model hash changed'
          target=pathlib.Path('model-viewer/s01-preview/v7/lahudi-academy-s01-v7.glb')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          assert hashlib.sha256(target.read_bytes()).hexdigest()==expected
          print('S01 V7 TEST preview ready:',len(data),'bytes')
          PY
          rm -rf _rg_s01_v7
      # Native CADCraft compiles into this SAME Pages website; it is not a CAD cloud server.
      - name: Validate embedded LiZhi CAD integration
        run: node --test tests/cad-embedded.test.cjs
      - name: Install pinned CADCraft WebAssembly toolchain
        run: bash cad/setup-build-toolchain.sh
      - name: Cache CADCraft cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: lizhi-cad-cargo-19e09447345750ea-v1
      - name: Compile CADCraft into existing portal
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
          RUSTFLAGS: '-C debuginfo=0'
        run: bash cad/build-runtime.sh

      # Hew is built into the SAME GitHub Pages origin as the authenticated
      # cloud portal. No extra website, token or remote 3D engine is required.
      # Source pin is reviewed separately in hew-editor-integration-preview.yml.
      - name: Checkout reviewed public Hew WASM fork at immutable SHA
        uses: actions/checkout@v4
        with:
          repository: lihuany635-create/lizhi-hew
          ref: 0e4e16061f8d15ec1e5eeb4570d760bedbe2d5b5
          path: .hew-model-build
          persist-credentials: false
      - name: Verify Hew source pin
        run: test "$(git -C .hew-model-build rev-parse HEAD)" = "0e4e16061f8d15ec1e5eeb4570d760bedbe2d5b5"
      - name: Pinned Hew Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .hew-model-build/.node-version
      - name: Hew pnpm package manager
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Hew Rust compile cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: .hew-model-build
      - name: Hew pinned wasm-pack
        working-directory: .hew-model-build
        run: bash scripts/install-wasm-pack.sh
      - name: Hew frozen dependencies
        working-directory: .hew-model-build
        run: pnpm install --frozen-lockfile
      - name: Compile native Hew editor to relative URL subpath
        working-directory: .hew-model-build
        run: |
          pnpm --dir app build
          pnpm --dir app exec vite build --base=./
      - name: Stage Hew React/WASM inside original portal with license and source provenance
        run: bash hew/build-embedded-runtime.sh
      - name: Verify isolated Hew editor route without damaging original portal
        run: |
          node --test tests/hew-portal-embed.test.mjs
          test -s hew-editor/index.html
          test -s hew-editor/SOURCE.txt
          test -s hew-editor/AGPL-3.0.txt
          test -s cad/runtime/index.html
          test -d model-viewer
      - name: Remove temporary Hew source and build dependencies from Pages payload
        run: rm -rf .hew-model-build

      # Rebuild the native production workspace from reviewed source on each Pages publish.
      # The two policy Markdown files remain regular same-origin static documents.
      - name: Build Employee Essentials into native production workspace
        working-directory: production/source
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npm run build
          test -s native-dist/production-workspace.js
          grep -q '員工必知' native-dist/production-workspace.js
          test -s ../../docs/AI_EMPLOYEE_HANDBOOK_v1.0.md
          test -s ../../docs/APP_REQUIREMENTS_INTERVIEW_v1.0.md
          cp native-dist/production-workspace.js ../production-workspace.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
