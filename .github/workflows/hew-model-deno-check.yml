name: Hew model Edge Deno syntax check (isolated)
on:
  push:
    branches: [feature/hew-3d-mcp-v1-20261025]
    paths:
      - 'supabase/functions/lizhi-model-site-mcp/**'
      - '.github/workflows/hew-model-deno-check.yml'
  pull_request:
    paths:
      - 'supabase/functions/lizhi-model-site-mcp/**'
      - '.github/workflows/hew-model-deno-check.yml'
permissions:
  contents: read
jobs:
  deno-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Deno static check of exact Edge entrypoint
        run: deno check supabase/functions/lizhi-model-site-mcp/index.ts
