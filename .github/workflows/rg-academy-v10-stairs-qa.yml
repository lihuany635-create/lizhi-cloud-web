name: RG Academy V10 Stair Tread and Headroom Gate
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-academy-v10-stairs-qa.yml'
      - 'model-viewer/revisions/academy-route-repair-v10/verify_stair_headroom.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Re-run all 10 walking routes and all 26 stair tread collision positions
        run: python model-viewer/revisions/academy-route-repair-v10/verify_stair_headroom.py
      - name: Archive exact stair QA, even when a genuine blocker is detected
        if: always()
        run: |
          set -e
          if [ -f model-viewer/staged-output/academy-route-repair-v10/V10-stair-headroom-qa.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add model-viewer/staged-output/academy-route-repair-v10/V10-stair-headroom-qa.json
            if ! git diff --cached --quiet; then
              git commit -m 'qa(academy): evidence for all 26 stair headroom tests'
              git pull --rebase origin rg-ep01-s01-stage-20261023
              git push origin HEAD:refs/heads/rg-ep01-s01-stage-20261023
            fi
          fi
