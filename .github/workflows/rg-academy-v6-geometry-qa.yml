name: RG Academy Entire Campus V6 Visible Geometry QA
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-academy-v6-geometry-qa.yml'
      - 'model-viewer/revisions/academy-all-corridors/verify_entire_campus_v6.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact school geometry, dimension and color report without rendering
        run: |
          set -euo pipefail
          python model-viewer/revisions/academy-all-corridors/verify_entire_campus_v6.py
      - name: Archive QA and camera settings for official school
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-viewer/staged-output/academy-entire-campus-v6/geometry-qa.json
          if ! git diff --cached --quiet; then
            git commit -m 'qa(academy V6): assert all eight wings, no km terrain, full-school camera bounds and contrast'
            git pull --rebase origin rg-ep01-s01-stage-20261023
            git push origin HEAD:refs/heads/rg-ep01-s01-stage-20261023
          fi
