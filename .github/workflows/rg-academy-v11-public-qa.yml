name: RG Academy V11 Public Exterior Mobile Visual QA
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-academy-v11-public-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Confirm published main academy is exterior V11 and same one GLB
        run: |
          set -euo pipefail
          dir=candidate-output/academy-v11-public
          mkdir -p "$dir"
          base='https://lihuany635-create.github.io/lizhi-cloud-web/model-viewer'
          curl -fSL --retry 12 --retry-all-errors --retry-delay 3 --max-time 150 "$base/" -o "$dir/index.html"
          curl -fSL --retry 12 --retry-all-errors --retry-delay 3 --max-time 150 "$base/current-models.json?v=20261023-academy-rb2-v11" -o "$dir/manifest.json"
          curl -fSL --retry 12 --retry-all-errors --retry-delay 3 --max-time 150 "$base/lahudi-academy.glb?v=rb2-gothic-exterior-v11-20261023" -o "$dir/lahudi-academy.glb"
          python - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          d=Path('candidate-output/academy-v11-public')
          b=(d/'lahudi-academy.glb').read_bytes()
          sha=hashlib.sha256(b).hexdigest()
          assert sha=='caab8cba4cbb9af22252ea2b05a35588b9529fb4af5720b787cf96b33229a9ae'
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b)==13932448
          j=json.loads((d/'manifest.json').read_text())
          m=next(x for x in j['models'] if x['model']=='lahudi-academy.glb')
          assert len(j['models'])==5 and m['current_sha256']==sha
          assert m['version']=='ACADEMY-LOCKED-PLAN-GOTHIC-EXTERIOR-FINISH-V11'
          h=(d/'index.html').read_text()
          assert 'lahudi-academy.glb?v=rb2-gothic-exterior-v11-20261023' in h
          assert 'id="academyViews"' in h
          ln=struct.unpack_from('<I',b,12)[0]
          g=json.loads(b[20:20+ln])
          new=[n for n in g['nodes'] if n.get('name','').startswith('RG-GAME-02-EXTERIOR-FINISH-V11__')]
          assert len(new)==96
          assert sum(n['extras']['shapes_baked'] for n in new)==3505
          print('V11 public official GLB and detailed exterior VERIFIED',sha)
          PY
      - name: Actual public academy mobile-sized Chrome screenshot
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium)"
          timeout 125s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage \
            --disable-background-networking --disable-extensions \
            --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --enable-webgl \
            --force-dark-mode --force-device-scale-factor=1 \
            --window-size=720,1380 --virtual-time-budget=16000 \
            --screenshot=candidate-output/academy-v11-public/academy-v11-exterior-mobile.png \
            'https://lihuany635-create.github.io/lizhi-cloud-web/model-viewer/#lahudi-academy'
          test "$(stat -c %s candidate-output/academy-v11-public/academy-v11-exterior-mobile.png)" -gt 50000
      - name: Store screenshot only as internal QA not extra published model
        run: |
          dst=model-viewer/staged-output/academy-exterior-finish-v11/mobile-qa
          mkdir -p "$dst"
          cp candidate-output/academy-v11-public/academy-v11-exterior-mobile.png "$dst/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          if ! git diff --cached --quiet; then
            git commit -m 'qa(academy V11): public production exterior mobile screenshot'
            git pull --rebase origin rg-ep01-s01-stage-20261023
            git push origin HEAD:refs/heads/rg-ep01-s01-stage-20261023
          fi
