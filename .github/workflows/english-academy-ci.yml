name: English Academy candidate CI
on:
  pull_request:
    paths:
      - 'english-academy/**'
      - '.github/workflows/english-academy-ci.yml'

permissions:
  contents: read

jobs:
  isolated-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check english-academy/poc/learning-gateway.mjs
          node --check english-academy/preview/state.mjs
          node --check english-academy/preview/app.mjs
          node --check english-academy/tests/browser-smoke.test.mjs
          node --check english-academy/tests/routing.test.mjs
          node --check english-academy/tests/schema-contract.test.mjs
          node --check english-academy/api/p1-handler.mjs
          node --check english-academy/tests/p1-api.test.mjs
      - name: P0 and P1 pure unit tests (no credentials)
        run: |
          node --test english-academy/poc/learning-gateway.test.mjs english-academy/preview/state.test.mjs english-academy/tests/routing.test.mjs english-academy/tests/schema-contract.test.mjs english-academy/tests/p1-api.test.mjs
      - name: Install isolated browser test dependencies
        working-directory: english-academy
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Mobile and desktop browser smoke tests (mock data only)
        run: node --test english-academy/tests/browser-smoke.test.mjs
      - name: Preserve test screenshots for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-academy-browser-candidate
          path: english-academy/test-results/
          if-no-files-found: ignore
          retention-days: 7

  postgres-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      pg:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: temporary-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Test unapplied migration in disposable PostgreSQL 17 service
        run: |
          set -euo pipefail
          DB_CONTAINER=$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -1)
          test -n "$DB_CONTAINER"
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < english-academy/tests/postgres-fixture.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < english-academy/schema/20261115_p1_candidate.sql
          docker exec -i "$DB_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < english-academy/tests/postgres-rls.test.sql
