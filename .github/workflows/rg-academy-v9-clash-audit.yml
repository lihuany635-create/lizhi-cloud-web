name: RG Academy V9 Clash Detection and Prevention Audit
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-academy-v9-clash-audit.yml'
      - 'model-viewer/revisions/academy-locked-plan-v9/audit_clashes_and_clearance_v1.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure real visible GLB wall and circulation collision candidates
        run: |
          set -euo pipefail
          python model-viewer/revisions/academy-locked-plan-v9/audit_clashes_and_clearance_v1.py
      - name: Verify evidence references the real canonical V9
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('model-viewer/staged-output/academy-locked-plan-v9/collision-audit-v1.json')
          r=json.loads(p.read_text())
          assert r['source_sha256']=='ada3ae9c9e55f995b4c8c60f63655c01e572561e523e199ef1cdf298c7e668c3'
          assert len(r['routes'])==10 and len(r['issues'])>=10
          assert r['visible_nodes_aabb_evaluated']>3000
          assert r['qa_status'].startswith('AABB_BROADPHASE')
          print('PASS: collision risk evidence has exact V9 source SHA and 10 routes')
          PY
      - name: Preserve collision measurements under staged-output without modifying GLB
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-viewer/staged-output/academy-locked-plan-v9/collision-audit-v1.json model-viewer/staged-output/academy-locked-plan-v9/collision-audit-v1.txt
          if ! git diff --cached --quiet; then
            git commit -m 'qa(academy V9): store hotspot positions and preventive clearance actions'
            git pull --rebase origin rg-ep01-s01-stage-20261023
            git push origin HEAD:refs/heads/rg-ep01-s01-stage-20261023
          fi
