name: RG Academy V12 Public Furniture and Interior Visual QA
on:
  push:
    branches: [rg-ep01-s01-stage-20261023]
    paths:
      - '.github/workflows/rg-academy-v12-public-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-view:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm real public V12 SHA, complete furniture mesh and GUI floor selector
        run: |
          set -euo pipefail
          d=candidate-output/academy-v12-public
          mkdir -p "$d"
          b=https://lihuany635-create.github.io/lizhi-cloud-web/model-viewer
          curl -fSL --retry 15 --retry-all-errors --retry-delay 4 --max-time 200 "$b/" -o "$d/index.html"
          curl -fSL --retry 15 --retry-all-errors --retry-delay 4 --max-time 200 "$b/current-models.json?v=20261023-academy-rb2-v12" -o "$d/manifest.json"
          curl -fSL --retry 15 --retry-all-errors --retry-delay 4 --max-time 200 "$b/lahudi-academy.glb?v=rb2-interior-v12-review-20261023" -o "$d/lahudi-academy.glb"
          python - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          d=Path('candidate-output/academy-v12-public')
          glb=(d/'lahudi-academy.glb').read_bytes()
          sha=hashlib.sha256(glb).hexdigest()
          assert sha=='b975ace3cd12744621688f4f5a0a8aa27f5dff1fbed4beb7ae5b9306dbbd3a66'
          assert glb[:4]==b'glTF' and struct.unpack_from('<I',glb,8)[0]==len(glb)==23192636
          length=struct.unpack_from('<I',glb,12)[0]
          scene=json.loads(glb[20:20+length])
          furn=[n for n in scene['nodes'] if n.get('name','').startswith('RG-GAME-02-INTERIOR-FURNITURE-V12__')]
          assert len(furn)==60
          assert {n['extras']['floor_layer'] for n in furn}=={'1F','2F'}
          assert len(scene['nodes'])==11983
          m=json.loads((d/'manifest.json').read_text())
          school=next(x for x in m['models'] if x['model']=='lahudi-academy.glb')
          assert len(m['models'])==5 and school['current_sha256']==sha
          assert school['interior_furniture_count']==1734
          assert school['version']=='ACADEMY-V12-INTERIOR-FURNITURE-PHASE1-REVIEW'
          h=(d/'index.html').read_text()
          assert 'id="academyInteriorSelect"' in h and 'academyInteriorView(zone)' in h
          assert 'lahudi-academy.glb?v=rb2-interior-v12-review-20261023' in h
          print('PASS V12 PUBLIC GLB AND UI',sha,'furniture batches',len(furn))
          PY
      - name: Capture actual mobile-sized V12 public school and furniture viewer
        run: |
          set -euo pipefail
          dir=candidate-output/academy-v12-public
          BROWSER="$(command -v google-chrome || command -v chromium)"
          timeout 125s "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage             --enable-unsafe-swiftshader --use-gl=angle --use-angle=swiftshader --enable-webgl             --force-device-scale-factor=1 --window-size=720,1380 --virtual-time-budget=23000             --screenshot="$dir/academy-v12-overview-mobile.png"             'https://lihuany635-create.github.io/lizhi-cloud-web/model-viewer/#lahudi-academy'
          test "$(stat -c %s "$dir/academy-v12-overview-mobile.png")" -gt 90000
      - name: Persist first V12 public mobile image evidence on review branch
        if: always()
        run: |
          dst=model-viewer/staged-output/academy-interior-furniture-v12/mobile-qa
          mkdir -p "$dst"
          cp candidate-output/academy-v12-public/academy-v12-overview-mobile.png "$dst/" 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          if ! git diff --cached --quiet; then
            git commit -m 'qa(academy V12): capture public school furniture preview'
            git pull --rebase origin rg-ep01-s01-stage-20261023
            git push origin HEAD:refs/heads/rg-ep01-s01-stage-20261023
          fi
