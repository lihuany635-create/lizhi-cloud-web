name: GridCraft P3 candidate read-only bridge security tests

on:
  push:
    branches:
      - feat/gridcraft-mcp-p0-20261118
    paths:
      - .github/workflows/gridcraft-p3-candidate.yml
      - integrations/gridcraft/p3-*
      - integrations/gridcraft/gridcraft_outbound_worker.py
      - integrations/gridcraft/test_outbound_worker.py
      - integrations/gridcraft/gridcraft_desktop_local.py
      - sites-migration/ai-workbench/gridcraft-p3-bridge.mjs
      - sites-migration/ai-workbench/route-p3-candidate.ts
      - integrations/gridcraft/P3_SQL_*.sql
      - integrations/gridcraft/p3-edge-candidate.ts
      - integrations/gridcraft/p3-edge.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: P3 mocked owner/device relay, replay, offline and Site adapter
        run: |
          node --test integrations/gridcraft/p3-relay-core.test.mjs integrations/gridcraft/p3-site-bridge.test.mjs
      - name: Verify candidate keeps legacy AI Workbench and photo tools unchanged
        run: |
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const s=fs.readFileSync('sites-migration/ai-workbench/route-p3-candidate.ts','utf8');assert(s.includes('GRIDCRAFT_P3_ENABLED'));assert(s.includes('legacyPOST'));assert(s.includes('PHOTO_SHEET_TOOLS'));assert(s.includes('...aiwb.result.tools, ...photo, ...gridcraft'));console.log('PASS: Site candidate composes three tool groups behind gate');"

  outbound-worker:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows outbound-only worker mocked relay/local tests
        shell: pwsh
        run: |
          python -m py_compile integrations/gridcraft/gridcraft_desktop_local.py integrations/gridcraft/gridcraft_outbound_worker.py integrations/gridcraft/test_outbound_worker.py
          python integrations/gridcraft/test_outbound_worker.py
          if ($LASTEXITCODE -ne 0) { throw "P3 outbound worker tests failed" }
      - name: Existing local-only control tests
        shell: pwsh
        run: |
          python integrations/gridcraft/test_desktop_local.py
          if ($LASTEXITCODE -ne 0) { throw "Existing local-only tests failed" }

  postgres-candidate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_USER: postgres
          POSTGRES_DB: p3_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d p3_isolated"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGPASSWORD: test-password
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: p3_isolated
    steps:
      - uses: actions/checkout@v4
      - name: Verify draft P3 device queue SQL in disposable PostgreSQL 16
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 -f integrations/gridcraft/P3_SQL_TEST.sql
          echo "PASS: isolated PostgreSQL RLS/owner queue SQL candidate (NOT production)"

  edge-candidate-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check draft Edge handler without any deployment
        run: deno check integrations/gridcraft/p3-edge-candidate.ts integrations/gridcraft/p3-edge.test.ts
      - name: Execute draft Edge handler security tests with isolated mock DB
        run: deno test --allow-env integrations/gridcraft/p3-edge.test.ts
      - name: Verify unconfigured Edge fails closed
        run: |
          deno eval --allow-env --no-check "
            import {handler} from './integrations/gridcraft/p3-edge-candidate.ts';
            const r=await handler(new Request('https://example.invalid/functions/v1/lizhi-gridcraft-bridge/site/dispatch',{method:'POST'}));
            if(r.status!==400)throw Error('Edge did not fail closed');
            const body=await r.json();
            if(body.error!=='GRIDCRAFT_GATE_OFF')throw Error('Edge gate not off by default');
            console.log('PASS: disabled backend blocks all unconfigured requests');
          "
