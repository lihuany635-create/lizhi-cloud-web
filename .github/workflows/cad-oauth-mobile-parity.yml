name: CAD OAuth Mobile-Parity Regression (isolated DB only)
on:
  push:
    branches: [fix/cad-oauth-mobile-parity]
    paths:
      - 'cad/relay/oauth-firstparty-contradiction-fix.REVIEW_ONLY.sql'
      - 'tests/cad-oauth-mobile-parity-postgres.sql'
      - '.github/workflows/cad-oauth-mobile-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: 'Static scope gate: repair only three CAD OAuth RPCs'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cad/relay/oauth-firstparty-contradiction-fix.REVIEW_ONLY.sql')
          s=p.read_text()
          names=['lizhi_cad_active_sessions','lizhi_cad_enqueue','lizhi_cad_job_status']
          assert all('create or replace function public.'+n+'(' in s for n in names)
          assert s.lower().count('create or replace function')==3
          assert 'drop table' not in s.lower() and 'truncate ' not in s.lower()
          assert 'lizhi_cad_client_allowed()' in s
          assert all('public.lizhi_web_is_allowed()' not in function_sql for function_sql in s.split('create or replace function')[1:])
          print('CAD_SQL_LIMITED_THREE_RPC_GUARD_PASS')
          PY
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Baseline owner isolation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/cad-mcp-relay-postgres.sql > /tmp/cad-baseline.log
          grep -q CAD_SQL_RLS_OAUTH_OWNER_ISOLATION_PASS /tmp/cad-baseline.log
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/cad-mcp-oauth-clients-postgres.sql > /tmp/cad-clients.log
          grep -q CAD_OAUTH_CLIENT_SEGREGATION_AND_REVOCATION_PASS /tmp/cad-clients.log
      - name: Reproduce existing broken auth and prove repair in disposable Postgres
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/cad-oauth-mobile-parity-postgres.sql | tee /tmp/cad-guard-test.log
          grep -q CAD_MOBILE_PARITY_OAUTH_GUARD_FIX_PASS /tmp/cad-guard-test.log
