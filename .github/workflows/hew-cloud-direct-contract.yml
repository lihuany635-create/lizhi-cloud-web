name: Hew cloud direct contract (isolated, no deployment)
on:
  push:
    branches:
      - feature/hew-workbench-cloud-direct-v1-20261026
    paths:
      - 'hew/cloud-direct/**'
      - 'hew/sql/003_model_cloud_direct.REVIEW_ONLY.sql'
      - 'tests/hew-cloud-*.test.mjs'
      - 'tests/sql/hew_model_cloud_direct_isolated.test.sql'
      - '.github/workflows/hew-cloud-direct-contract.yml'
  pull_request:
    paths:
      - 'hew/cloud-direct/**'
      - 'hew/sql/003_model_cloud_direct.REVIEW_ONLY.sql'
      - 'tests/hew-cloud-*.test.mjs'
      - 'tests/sql/hew_model_cloud_direct_isolated.test.sql'
      - '.github/workflows/hew-cloud-direct-contract.yml'
permissions:
  contents: read
jobs:
  node-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Offline model document and Site schema safety
        run: node --test tests/hew-cloud-direct-core.test.mjs tests/hew-cloud-site-contract.test.mjs tests/hew-cloud-edge-contract.test.mjs tests/hew-cloud-site-edge-chain.test.mjs tests/hew-cloud-native-bridge.test.mjs
  edge-source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Edge v3 package uses exact reviewed cloud implementation
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          const core=fs.readFileSync('hew/cloud-direct/model-edge-core.mjs','utf8')
          const edge=fs.readFileSync('supabase/functions/lizhi-model-site-mcp/cloud-edge-core.mjs','utf8')
          assert.equal(edge,core.replace("from './model-site-contract.mjs'","from './cloud-model-site-contract.mjs'"))
          assert.equal(fs.readFileSync('hew/cloud-direct/model-site-contract.mjs','utf8'),
            fs.readFileSync('supabase/functions/lizhi-model-site-mcp/cloud-model-site-contract.mjs','utf8'))
          const old=fs.readFileSync('supabase/functions/lizhi-model-site-mcp/index.ts','utf8')
          assert.match(old,/handleModelEdgeRequest/)
          assert.match(old,/handleCloudModelEdgeRequest/)
          assert.match(old,/searchParams.get\('cloud'\)==='1'/)
          console.log('HEW_CLOUD_DIRECT_EDGE_SOURCE_MATCH_PASS')
          JS
  pg16-private-cloud-document:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get update && sudo apt-get install -y postgresql-client; fi
      - name: Atomic owner/revision/idempotence/no-browser queue cloud tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/hew_model_cloud_direct_isolated.test.sql
