name: LiCut ChatGPT bridge QA (no deploy)

on:
  pull_request:
    paths:
      - 'licut/index.html'
      - 'supabase/functions/lizhi-ai-workbench/index.ts'
      - 'tests/licut-chatgpt-bridge.test.mjs'
      - '.github/workflows/licut-chatgpt-bridge-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all 47 editing operations and compiled client syntax
        run: node --test tests/licut-chatgpt-bridge.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check existing AI Workbench edge with LiCut tools
        run: deno check supabase/functions/lizhi-ai-workbench/index.ts
